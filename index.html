// ═══════════════════════════════════════════════
//  TAB 5 — ANÁLISIS DE PRODUCTOS
// ═══════════════════════════════════════════════
class ProductosErrorBoundary extends React.Component {
  constructor(props) { super(props); this.state = { error: null }; }
  static getDerivedStateFromError(e) { return { error: e }; }
  componentDidCatch(e, info) { console.error("ProductosTab error:", e, info); }
  render() {
    if (this.state.error) {
      return (
        <div className="flex flex-col items-center justify-center py-20 gap-4" style={{color:"#f87171"}}>
          <BarChart2 size={40} style={{opacity:0.3}}/>
          <p className="text-sm font-semibold">Error al renderizar el análisis</p>
          <p className="text-xs text-gray-500 max-w-md text-center">{String(this.state.error)}</p>
          <button type="button" className="text-xs text-blue-400 hover:underline mt-1"
            onClick={() => this.setState({ error: null })}>
            Reintentar
          </button>
        </div>
      );
    }
    return this.props.children;
  }
}

const ProductosTab = ({ data }) => {
  const [search,           setSearch]           = useState("");
  const [selectedClients,  setSelectedClients]  = useState(new Set());
  const [clientSearch,     setClientSearch]     = useState("");
  const [clientPanelOpen,  setClientPanelOpen]  = useState(false);
  const [dateFrom,         setDateFrom]         = useState("");
  const [dateTo,           setDateTo]           = useState("");
  const [panelProduct,     setPanelProduct]     = useState(null);
  const prodSort = useSort("venta", "desc");

  const toggleClient = (c) => setSelectedClients(prev => {
    const next = new Set(prev);
    next.has(c) ? next.delete(c) : next.add(c);
    return next;
  });

  const rows = useMemo(() =>
    data.map((r) => ({
      producto:  col(r, "Producto"),
      cliente:   col(r, "Razón Social", "Razon Social", "Cliente", "Rz. Social"),
      fecha:     parseDate(col(r, "Fecha")),
      venta:     parseNum(col(r, "Total Línea", "Total Linea", "Total")),
      contrib:   parseNum(col(r, "Margen Contrib $")),
      cantidad:  parseNum(col(r, "Cantidad")),
      precioUn:  parseNum(col(r, "Precio Un.", "Precio Un", "Precio Unitario", "P.U.")),
    })).filter((r) => r.fecha && r.producto),
  [data]);

  const dateBounds = useMemo(() => {
    if (!rows.length) return { min: "", max: "" };
    const toInput = (ms) => {
      const d = new Date(ms);
      return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
    };
    let minT = Infinity, maxT = -Infinity;
    rows.forEach((r) => { const t = r.fecha.getTime(); if (t < minT) minT = t; if (t > maxT) maxT = t; });
    return { min: toInput(minT), max: toInput(maxT) };
  }, [rows]);

  useEffect(() => {
    if (dateBounds.min && !dateFrom) setDateFrom(dateBounds.min);
    if (dateBounds.max && !dateTo)   setDateTo(dateBounds.max);
  }, [dateBounds.min, dateBounds.max]);

  const clientList = useMemo(() => {
    const set = new Set(rows.map((r) => r.cliente).filter(Boolean));
    return Array.from(set).sort((a, b) => a.localeCompare(b, "es"));
  }, [rows]);

  const filteredRows = useMemo(() => {
    const from = dateFrom ? new Date(dateFrom) : null;
    const to   = dateTo   ? new Date(dateTo + "T23:59:59") : null;
    return rows.filter((r) => {
      if (from && r.fecha < from) return false;
      if (to   && r.fecha > to)   return false;
      if (selectedClients.size > 0 && !selectedClients.has(r.cliente)) return false;
      return true;
    });
  }, [rows, dateFrom, dateTo, selectedClients]);

  const productSummary = useMemo(() => {
    const map = {};
    filteredRows.forEach((r) => {
      const k = r.producto;
      if (!map[k]) map[k] = { producto: k, venta: 0, contrib: 0, cantidad: 0, clientes: new Set(), rows: [], precios: [] };
      map[k].venta    += r.venta;
      map[k].contrib  += r.contrib;
      map[k].cantidad += r.cantidad;
      if (r.cliente) map[k].clientes.add(r.cliente);
      map[k].rows.push(r);
      if (r.precioUn > 0) map[k].precios.push(r.precioUn);
    });
    return Object.values(map).map((p) => {
      const margen        = p.venta > 0 ? (p.contrib / p.venta) * 100 : 0;
      const precioMin     = p.precios.length ? Math.min(...p.precios) : null;
      const precioMax     = p.precios.length ? Math.max(...p.precios) : null;
      const precioPromedio = p.cantidad > 0 ? p.venta / p.cantidad : null;
      const prodRows = filteredRows.filter(r => r.producto === p.producto);
      const curr30End    = dateTo ? new Date(dateTo + "T23:59:59") : new Date();
      const curr30Start  = new Date(curr30End.getTime() - 29 * 86400000);
      const prev30End2   = new Date(curr30End.getTime() - 30 * 86400000);
      const prev30Start2 = new Date(curr30End.getTime() - 59 * 86400000);
      const curr30V = prodRows.filter(r => r.fecha >= curr30Start && r.fecha <= curr30End).reduce((s,r) => s + r.venta, 0);
      const prev30V = prodRows.filter(r => r.fecha >= prev30Start2 && r.fecha <= prev30End2).reduce((s,r) => s + r.venta, 0);
      const delta30 = prev30V > 0 ? ((curr30V - prev30V) / prev30V) * 100 : null;
      return { ...p, clientes: p.clientes.size, margen, precioMin, precioMax, precioPromedio, delta30 };
    });
  }, [filteredRows, dateTo]);

  const globalStats = useMemo(() => ({
    totalProductos: productSummary.length,
    totalVenta:     productSummary.reduce((s, p) => s + p.venta,   0),
    totalContrib:   productSummary.reduce((s, p) => s + p.contrib, 0),
    totalClientes:  new Set(filteredRows.map((r) => r.cliente).filter(Boolean)).size,
  }), [productSummary, filteredRows]);

  const filteredProducts = useMemo(() => {
    if (!search.trim()) return productSummary;
    const q = normStr(search);
    return productSummary.filter((p) => normStr(p.producto).includes(q));
  }, [productSummary, search]);

  const subtotals = useMemo(() => ({
    venta:   filteredProducts.reduce((s, p) => s + p.venta,   0),
    contrib: filteredProducts.reduce((s, p) => s + p.contrib, 0),
    cantidad:filteredProducts.reduce((s, p) => s + p.cantidad,0),
    get margen() { return this.venta > 0 ? (this.contrib / this.venta) * 100 : 0; },
  }), [filteredProducts]);

  const sortedProducts = useMemo(() =>
    applySort(filteredProducts, prodSort.key, prodSort.dir, (p, k) => {
      if (k === "producto") return p.producto.toLowerCase();
      if (k === "delta30") return p.delta30 ?? -999;
      return p[k] ?? 0;
    }),
  [filteredProducts, prodSort.key, prodSort.dir]);

  const { page, go, totalPages, slice, total } = usePag(sortedProducts);

  const panelDetail = useMemo(() => {
    if (!panelProduct) return null;
    const pRows = panelProduct.rows;
    const byWeek = {};
    pRows.forEach((r) => {
      const ws = getWeekStart(r.fecha);
      const wk = ws.toISOString().slice(0, 10);
      if (!byWeek[wk]) byWeek[wk] = { label: fmtDate(ws), venta: 0, contrib: 0 };
      byWeek[wk].venta   += r.venta;
      byWeek[wk].contrib += r.contrib;
    });
    const trend = Object.entries(byWeek).sort(([a],[b]) => a.localeCompare(b)).map(([,v]) => v);
    const clientMap = {};
    pRows.forEach((r) => {
      const k = r.cliente || "Sin razón social";
      if (!clientMap[k]) clientMap[k] = { cliente: k, venta: 0, contrib: 0, cantidad: 0, precios: [], lastFecha: null };
      clientMap[k].venta    += r.venta;
      clientMap[k].contrib  += r.contrib;
      clientMap[k].cantidad += r.cantidad;
      if (r.precioUn > 0) clientMap[k].precios.push({ p: r.precioUn, q: r.cantidad || 1, fecha: r.fecha });
      if (!clientMap[k].lastFecha || (r.fecha && r.fecha > clientMap[k].lastFecha)) clientMap[k].lastFecha = r.fecha;
    });
    const totalProdVenta = Object.values(clientMap).reduce((s, c) => s + c.venta, 0);
    const clientBreakdown = Object.values(clientMap).map((c) => {
      const ps = c.precios;
      const precioMin = ps.length ? ps.reduce((m, x) => Math.min(m, x.p), Infinity) : 0;
      const precioMax = ps.length ? ps.reduce((m, x) => Math.max(m, x.p), -Infinity) : 0;
      const totalQ = ps.reduce((s, x) => s + x.q, 0);
      const precioPromedio = totalQ > 0 ? ps.reduce((s, x) => s + x.p * x.q, 0) / totalQ : 0;
      const lastEntry = ps.length ? [...ps].sort((a,b) => b.fecha - a.fecha)[0] : null;
      return {
        ...c, margen: c.venta > 0 ? (c.contrib / c.venta) * 100 : 0,
        pct: totalProdVenta > 0 ? (c.venta / totalProdVenta) * 100 : 0,
        precioMin, precioMax, precioPromedio,
        precioUltimo: lastEntry ? lastEntry.p : 0,
      };
    }).sort((a, b) => b.venta - a.venta);
    return { ...panelProduct, trend, clientBreakdown };
  }, [panelProduct]);

  const STH = (props) => <SortTh {...props} currentKey={prodSort.key} dir={prodSort.dir} onSort={prodSort.toggle}/>;

  return (
    <div className="space-y-4">
      {/* Product detail panel */}
      {panelDetail && (
        <DetailPanel
          title={panelDetail.producto}
          subtitle={`${panelDetail.clientes} cliente${panelDetail.clientes !== 1 ? "s" : ""} · ${panelDetail.rows.length.toLocaleString("es-CL")} líneas`}
          onClose={() => setPanelProduct(null)}>
          <div className="space-y-4">
            <div className="grid grid-cols-2 gap-3">
              <Card label="Venta Neta"     value={"$" + fmtM(panelDetail.venta)}   color="text-blue-300"/>
              <Card label="Contribución"   value={"$" + fmtM(panelDetail.contrib)} color="text-emerald-300"/>
              <Card label="Margen %"       value={fmtPct(panelDetail.margen)}
                color={panelDetail.margen > 15 ? "text-emerald-300" : panelDetail.margen > 0 ? "text-yellow-300" : "text-red-400"}/>
              <Card label="Cantidad Total" value={fmt(panelDetail.cantidad, 2)} color="text-white" sub="kg / unid."/>
            </div>
            {panelDetail.trend.length > 1 && (
              <div style={{background:"#111827",border:"1px solid #374151",borderRadius:12,padding:12}}>
                <p style={{fontSize:11,color:"#6B7280",marginBottom:8,textTransform:"uppercase",letterSpacing:"0.05em"}}>Tendencia semanal</p>
                <SvgTrend data={panelDetail.trend} height={90}/>
                <div style={{display:"flex",gap:16,marginTop:4,fontSize:11,color:"#6B7280"}}>
                  <span><span style={{display:"inline-block",width:12,height:2,background:"#3B82F6",verticalAlign:"middle",marginRight:4}}/>Venta</span>
                  <span><span style={{display:"inline-block",width:12,height:2,background:"#10B981",verticalAlign:"middle",marginRight:4}}/>Contribución</span>
                </div>
              </div>

      {/* Subtotals bar */}

        {[
          { label: "Productos filtrados", value: String(filteredProducts.length), color: "#93C5FD" },

          { label: "Contribución",        value: "$" + fmtM(subtotals.contrib),  color: "#6EE7B7" },

            color: subtotals.margen > 15 ? "#6EE7B7" : subtotals.margen > 0 ? "#FDE68A" : "#FCA5A5" },

        ].map((s, i, arr) => (
          <div key={i} style={{flex:1,padding:"8px 14px",
            borderRight: i < arr.length - 1 ? "1px solid #21212E" : "none",

            <p style={{fontSize:10,color:"#6B7280",textTransform:"uppercase",letterSpacing:"0.05em",marginBottom:2}}>{s.label}</p>
            <p style={{fontSize:14,fontWeight:700,color:s.color}}>{s.value}</p>

        ))}
      </div>

      {/* Products table */}
      <div className="bg-gray-900 border border-gray-700 rounded-xl overflow-hidden">
        <div className="px-4 py-2.5 border-b border-gray-700 text-xs text-gray-500">
          {filteredProducts.length !== productSummary.length
            ? `${filteredProducts.length} de ${productSummary.length} productos`
            : `${productSummary.length} productos — haz clic para ver detalle`}
        </div>
        <div className="overflow-x-auto">
          <table className="w-full">
            <thead className="bg-gray-800/60">
              <tr>
                <STH label="Producto"     sk="producto"      />
                <STH label="Venta Neta"   sk="venta"         right/>
                <STH label="Contribución" sk="contrib"       right/>
                <STH label="Margen %"     sk="margen"        right/>
                <STH label="Cantidad"     sk="cantidad"      right/>
                <STH label="P. Mínimo"    sk="precioMin"     right/>
                <STH label="P. Máximo"    sk="precioMax"     right/>
                <STH label="P. Promedio"  sk="precioPromedio" right/>
                <STH label="Clientes"     sk="clientes"      right/>
                <STH label="Tendencia"    sk="delta30"       right/>
              </tr>
            </thead>
            <tbody className="divide-y divide-gray-800/60">
              {slice.map((p) => (
                <tr key={p.producto} onClick={() => setPanelProduct(p)} style={{cursor:"pointer"}}
                  className="hover:bg-blue-900/20 transition-colors">

                    <span className="block truncate" title={p.producto}>{p.producto}</span>
                  </td>
                  <Td ch={"$" + fmtM(p.venta)}   right bold/>
                  <Td ch={"$" + fmtM(p.contrib)}  right color="text-emerald-400"/>
                  <Td ch={fmtPct(p.margen)} right color={p.margen > 15 ? "text-emerald-300" : p.margen > 0 ? "text-yellow-300" : "text-red-400"}/>
                  <Td ch={fmt(p.cantidad, 2)} right dim/>
                  <Td ch={p.precioMin     != null ? "$" + fmtM(p.precioMin)      : "—"} right color="text-blue-300"/>
                  <Td ch={p.precioMax     != null ? "$" + fmtM(p.precioMax)      : "—"} right color="text-blue-300"/>
                  <Td ch={p.precioPromedio != null ? "$" + fmtM(p.precioPromedio) : "—"} right color="text-blue-300" bold/>
                  <Td ch={p.clientes} right dim/>
                  <td className="px-3 py-2.5 text-sm text-right whitespace-nowrap">
                    {p.delta30 != null && isFinite(p.delta30)
                      ? <span style={{
                          fontSize: 11, padding: "2px 7px", borderRadius: 99, fontWeight: 700,
                          background: p.delta30 >= 0 ? "rgba(16,185,129,0.12)" : "rgba(239,68,68,0.12)",
                          color: p.delta30 >= 0 ? "#34D399" : "#F87171",
                          border: `1px solid ${p.delta30 >= 0 ? "rgba(16,185,129,0.3)" : "rgba(239,68,68,0.3)"}`
                        }}>
                          {p.delta30 >= 0 ? "↑" : "↓"}{Math.abs(p.delta30).toFixed(0)}%
                        </span>
                      : <span style={{color:"#333345",fontSize:11}}>—</span>}
                  </td>

              ))}

// ═══════════════════════════════════════════════
//  TAB 0 — RESUMEN EJECUTIVO
// ═══════════════════════════════════════════════

const ResumenTab = ({ ventasData, guiasData, comprasData }) => {
  // Parse ventas rows
  const ventasRows = useMemo(() =>
    ventasData.map((r) => ({
      cliente:  col(r, "Razón Social", "Razon Social"),
      fecha:    parseDate(col(r, "Fecha")),
      producto: col(r, "Producto"),
      venta:    parseNum(col(r, "Total Línea", "Total Linea", "Total")),
      contrib:  parseNum(col(r, "Margen Contrib $")),
    })).filter((r) => r.fecha && r.cliente),
  [ventasData]);

  // Parse compras rows
  const comprasRows = useMemo(() =>
    comprasData.map((r) => ({
      proveedor: col(r, "Razón Social", "Razon Social"),
      fecha:     parseDate(col(r, "Fecha")),
      total:     parseNum(col(r, "Total Línea", "Total Linea")),
    })).filter((r) => r.proveedor),
  [comprasData]);

  const refDate = useMemo(() => {
    if (!ventasRows.length) return new Date();
    let max = -Infinity;
    ventasRows.forEach((r) => { const t = r.fecha.getTime(); if (t > max) max = t; });
    return new Date(max);
  }, [ventasRows]);

  const P = useMemo(() => getPeriods(refDate), [refDate]);

  const prev30End   = useMemo(() => new Date(refDate.getTime() - 30 * 86400000), [refDate]);
  const prev30Start = useMemo(() => new Date(refDate.getTime() - 59 * 86400000), [refDate]);

  const roll30    = useMemo(() => calcP(ventasRows.filter(r => inR(r.fecha, P.roll30Start, P.today))),  [ventasRows, P]);
  const prev30    = useMemo(() => calcP(ventasRows.filter(r => inR(r.fecha, s0(prev30Start), e23(prev30End)))), [ventasRows, prev30Start, prev30End]);
  const quarter   = useMemo(() => calcP(ventasRows.filter(r => inR(r.fecha, P.qStart, P.qEnd))),       [ventasRows, P]);

  const delta30V  = prev30.venta > 0 ? ((roll30.venta - prev30.venta) / prev30.venta) * 100 : null;
  const delta30M  = prev30.venta > 0 ? roll30.margen - prev30.margen : null;

  const activeClients30 = useMemo(() => {
    const s = new Set();
    ventasRows.filter(r => inR(r.fecha, P.roll30Start, P.today)).forEach(r => s.add(r.cliente));
    return s.size;
  }, [ventasRows, P]);

  const totalCompras    = comprasRows.reduce((s, r) => s + r.total, 0);
  const totalProveedores = new Set(comprasRows.map(r => r.proveedor)).size;

  // Client summaries for Top 5 and alerts
  const clientMap = useMemo(() => {
    const m = {};
    ventasRows.forEach((r) => {
      if (!m[r.cliente]) m[r.cliente] = [];
      m[r.cliente].push(r);
    });
    return m;
  }, [ventasRows]);

  const summaries = useMemo(() => {
    return Object.entries(clientMap).map(([cliente, rows]) => {
      const f = (a, b) => rows.filter(r => inR(r.fecha, a, b));
      const totalV   = rows.reduce((s, r) => s + r.venta, 0);
      const r30      = calcP(f(P.roll30Start, P.today));
      const p30      = calcP(f(s0(prev30Start), e23(prev30End)));
      const trimestre = calcP(f(P.qStart, P.qEnd));
      return { cliente, totalV, roll30: r30, prev30: p30, quarter: trimestre };
    }).sort((a, b) => b.totalV - a.totalV);
  }, [clientMap, P, prev30Start, prev30End]);

  const totalVentaGlobal = summaries.reduce((s, c) => s + c.totalV, 0);
  const top5 = summaries.slice(0, 5);

  // Supplier recency map
  const supplierMap = useMemo(() => {
    const m = {};
    comprasRows.forEach(r => {
      if (!m[r.proveedor]) m[r.proveedor] = { lastFecha: null, totalC: 0 };
      m[r.proveedor].totalC += r.total;
      if (!m[r.proveedor].lastFecha || (r.fecha && r.fecha > m[r.proveedor].lastFecha))
        m[r.proveedor].lastFecha = r.fecha;
    });
    return m;
  }, [comprasRows]);

  const top4Suppliers = useMemo(() =>
    Object.entries(supplierMap)
      .map(([prov, v]) => ({ prov, ...v }))
      .sort((a, b) => b.totalC - a.totalC)
      .slice(0, 4),
  [supplierMap]);

  // Top 5 productos por venta total
  const topProductos = useMemo(() => {
    const m = {};
    ventasRows.forEach(r => {
      if (!r.producto) return;
      if (!m[r.producto]) m[r.producto] = { producto: r.producto, venta: 0, contrib: 0, clientes: new Set() };
      m[r.producto].venta   += r.venta;
      m[r.producto].contrib += r.contrib;
      if (r.cliente) m[r.producto].clientes.add(r.cliente);
    });
    return Object.values(m)
      .map(p => ({ ...p, margen: p.venta > 0 ? (p.contrib / p.venta) * 100 : 0, clientes: p.clientes.size }))
      .sort((a, b) => b.venta - a.venta)
      .slice(0, 5);
  }, [ventasRows]);

  const totalVentaProductos = topProductos.reduce((s, p) => s + p.venta, 0);

  // Stock crítico — lee stockActual de localStorage y cruza con demanda de guías
  const stockCritico = useMemo(() => {
    let stockActual = {};
    try { stockActual = JSON.parse(localStorage.getItem("gp_inv_stock_v1") || "{}"); } catch {}

    const sourceData = guiasData.length > 0 ? guiasData : ventasData;
    if (!sourceData.length) return [];

    // Build quick SKU demand from all source rows
    const skuMap = {};
    sourceData.forEach(r => {
      const prod     = col(r, "Producto");
      const fecha    = parseDate(col(r, "Fecha"));
      const cantidad = parseNum(col(r, "Cantidad"));
      if (!prod || !fecha || !cantidad) return;
      if (!skuMap[prod]) skuMap[prod] = { events: [], minT: Infinity, maxT: -Infinity };
      skuMap[prod].events.push(cantidad);
      const t = fecha.getTime();
      if (t < skuMap[prod].minT) skuMap[prod].minT = t;
      if (t > skuMap[prod].maxT) skuMap[prod].maxT = t;
    });

    const alerts = [];
    Object.entries(skuMap).forEach(([prod, d]) => {
      const stock = parseFloat(stockActual[prod] || "") || 0;
      if (stock <= 0) return; // no stock ingresado — no alertar
      const totalDaysProd = Math.max(1, Math.round((d.maxT - d.minT) / 86400000));
      const sortedQty  = [...d.events].sort((a, b) => a - b);
      const medianQty  = sortedQty[Math.floor(sortedQty.length / 2)] || 1;
      const threshold  = medianQty * 3;
      const baseQty    = d.events.filter(q => q <= threshold).reduce((s, q) => s + q, 0);
      const daily      = totalDaysProd > 0 ? baseQty / totalDaysProd : 0;
      if (daily <= 0) return;
      const dias = Math.round(stock / daily);
      if (dias < 7) alerts.push({ prod, dias, stock, daily });
    });

    return alerts.sort((a, b) => a.dias - b.dias).slice(0, 8);
  }, [guiasData, ventasData]);

  // Alerts
  const alerts = useMemo(() => {
    const list = [];
    // a) Concentration risk ≥40%
    summaries.forEach(c => {
      const pct = totalVentaGlobal > 0 ? (c.totalV / totalVentaGlobal) * 100 : 0;
      if (pct >= 40) list.push({ type: "red", msg: `${c.cliente} representa el ${fmt(pct,1)}% de la venta total` });
    });
    // b) Suppliers without recent purchase >45 days
    const now = Date.now();
    Object.entries(supplierMap).forEach(([prov, v]) => {
      if (v.lastFecha) {
        const days = Math.floor((now - v.lastFecha.getTime()) / 86400000);
        if (days > 45) list.push({ type: "amber", msg: `${prov} lleva ${days} días sin compra` });
      }
    });
    // c) Margin drop
    if (delta30M !== null && delta30M < -2) {
      list.push({ type: "amber", msg: `Margen cayó ${Math.abs(delta30M).toFixed(1)} ppts en los últimos 30 días` });
    }
    return list;
  }, [summaries, totalVentaGlobal, supplierMap, delta30M]);

  const daysSince = (d) => !d ? null : Math.floor((Date.now() - d.getTime()) / 86400000);

  return (
    <div className="space-y-5 fade-in">
      {/* Section 1: KPI row */}
      <div className="grid grid-cols-2 lg:grid-cols-4 gap-3">
        <Card
          label="Venta 30 Días"
          value={"$" + fmtM(roll30.venta)}
          sub={`Clientes: ${activeClients30} activos`}
          color="text-blue-300"
          delta={delta30V}
        />
        <Card
          label="Margen 30 Días"
          value={fmtPct(roll30.margen)}
          sub={"Contrib: $" + fmtM(roll30.contrib)}
          color="text-emerald-300"
          delta={delta30M}
        />
        <Card
          label="Venta Trimestre"
          value={"$" + fmtM(quarter.venta)}
          sub={fmtPct(quarter.margen) + " margen"}
          color="text-yellow-300"
        />
        <Card
          label="Total Compras"
          value={"$" + fmtM(totalCompras)}
          sub={`${totalProveedores} proveedores`}
          color="text-purple-300"
        />
      </div>

      {/* Section 2: Top 5 Clientes */}
      {top5.length > 0 && (
        <div className="bg-gray-900 border border-gray-700 rounded-xl overflow-hidden">
          <div className="px-4 py-3 border-b border-gray-700 flex items-center gap-2">
            <Award size={15} className="text-yellow-400" />
            <span className="font-semibold text-white text-sm">Top 5 Clientes</span>

          <div className="overflow-x-auto">
            <table className="w-full">
              <thead className="bg-gray-800/60">
                <tr>
                  <Th ch="Cliente"/>

                {top5.map((c, i) => {
                  const pct = totalVentaGlobal > 0 ? (c.totalV / totalVentaGlobal) * 100 : 0;

                    ? ((c.roll30.venta - c.prev30.venta) / c.prev30.venta) * 100

                    <tr key={c.cliente} className="hover:bg-blue-900/20 transition-colors">
                      <td className="px-3 py-2.5 text-sm font-medium text-white max-w-[200px]">
                        <span className="block truncate">{c.cliente}</span>
                        {pct >= 40 && <span style={{marginLeft:6,fontSize:9,padding:"1px 5px",borderRadius:99,background:"rgba(239,68,68,0.15)",color:"#F87171",border:"1px solid rgba(239,68,68,0.3)",whiteSpace:"nowrap",verticalAlign:"middle"}}>⚠ {fmt(pct,1)}%</span>}
                        {pct >= 25 && pct < 40 && <span style={{marginLeft:6,fontSize:9,padding:"1px 5px",borderRadius:99,background:"rgba(245,158,11,0.15)",color:"#FBBF24",border:"1px solid rgba(245,158,11,0.3)",whiteSpace:"nowrap",verticalAlign:"middle"}}>▲ {fmt(pct,1)}%</span>}
                      </td>
                      <Td ch={"$" + fmtM(c.quarter.venta)} right bold/>
                      <Td ch={fmtPct(c.quarter.margen)} right
                        color={c.quarter.margen > 15 ? "text-emerald-300" : c.quarter.margen > 0 ? "text-yellow-300" : "text-red-400"}/>
                      <td className="px-3 py-2.5 text-sm text-right whitespace-nowrap">
                        {trendDelta != null && isFinite(trendDelta)
                          ? <span style={{
                              fontSize:11, padding:"2px 7px", borderRadius:99, fontWeight:700,
                              background: trendDelta >= 0 ? "rgba(16,185,129,0.12)" : "rgba(239,68,68,0.12)",
                              color: trendDelta >= 0 ? "#34D399" : "#F87171",
                              border: `1px solid ${trendDelta >= 0 ? "rgba(16,185,129,0.3)" : "rgba(239,68,68,0.3)"}`
                            }}>
                              {trendDelta >= 0 ? "↑" : "↓"}{Math.abs(trendDelta).toFixed(0)}%
                            </span>
                          : <span style={{color:"#333345",fontSize:11}}>—</span>}
                      </td>
                    </tr>
                  );
                })}
              </tbody>
            </table>
          </div>
        </div>
      )}

      {/* Section 3: Top 5 Productos */}
      {topProductos.length > 0 && (
        <div className="bg-gray-900 border border-gray-700 rounded-xl overflow-hidden">
          <div className="px-4 py-3 border-b border-gray-700 flex items-center gap-2">
            <TrendingUp size={15} className="text-blue-400" />
            <span className="font-semibold text-white text-sm">Top 5 Productos</span>
            <span className="text-xs text-gray-600 ml-1">— por venta total</span>
          </div>
          <div className="overflow-x-auto">
            <table className="w-full">
              <thead className="bg-gray-800/60">
                <tr>
                  <Th ch="Producto"/>
                  <Th ch="Venta" right/>
                  <Th ch="% total" right/>
                  <Th ch="Margen %" right/>
                  <Th ch="Clientes" right/>
                </tr>
              </thead>
              <tbody className="divide-y divide-gray-800/60">
                {topProductos.map((p, i) => {
                  const pct = totalVentaProductos > 0 ? (p.venta / totalVentaProductos) * 100 : 0;
                  return (
                    <tr key={p.producto} className="hover:bg-blue-900/20 transition-colors">
                      <td className="px-3 py-2.5 text-sm font-medium text-white max-w-[240px]">
                        <div style={{display:"flex",alignItems:"center",gap:8}}>
                          <span style={{fontSize:11,fontWeight:700,color:"#4B5563",minWidth:16}}>{i+1}</span>
                          <span className="block truncate" title={p.producto}>{p.producto}</span>
                        </div>
                      </td>
                      <Td ch={"$" + fmtM(p.venta)} right bold/>
                      <td className="px-3 py-2.5 text-sm text-right whitespace-nowrap">
                        <div style={{display:"flex",alignItems:"center",justifyContent:"flex-end",gap:6}}>
                          <div style={{width:60,height:4,borderRadius:99,background:"#1f2937",overflow:"hidden"}}>
                            <div style={{width:`${Math.min(100,pct)}%`,height:"100%",background:"#3B82F6",borderRadius:99}}/>
                          </div>
                          <span style={{fontSize:12,color:"#93C5FD",minWidth:36}}>{fmt(pct,1)}%</span>
                        </div>
                      </td>
                      <Td ch={fmtPct(p.margen)} right
                        color={p.margen > 15 ? "text-emerald-300" : p.margen > 0 ? "text-yellow-300" : "text-red-400"}/>
                      <Td ch={p.clientes} right dim/>
                    </tr>
                  );
                })}
              </tbody>
            </table>
          </div>
        </div>
      )}

      {/* Section 4: Alerta stock crítico */}
      {stockCritico.length > 0 && (
        <div className="bg-gray-900 border border-gray-700 rounded-xl overflow-hidden">
          <div className="px-4 py-3 border-b border-gray-700 flex items-center gap-2">
            <AlertTriangle size={15} className="text-red-400" />
            <span className="font-semibold text-white text-sm">Stock Crítico</span>
            <span className="text-xs text-gray-600 ml-1">— productos con menos de 7 días de cobertura (según stock ingresado en Inventario)</span>
          </div>
          <div className="overflow-x-auto">
            <table className="w-full">
              <thead className="bg-gray-800/60">
                <tr>
                  <Th ch="Producto"/>
                  <Th ch="Stock actual" right/>
                  <Th ch="Demanda/día" right/>
                  <Th ch="Días cobertura" right/>
                </tr>
              </thead>
              <tbody className="divide-y divide-gray-800/60">
                {stockCritico.map((s) => (
                  <tr key={s.prod} className="hover:bg-red-900/10 transition-colors">
                    <td className="px-3 py-2.5 text-sm font-medium text-white max-w-[240px]">
                      <span className="block truncate" title={s.prod}>{s.prod}</span>
                    </td>
                    <Td ch={fmt(s.stock, 1)} right color="text-gray-300"/>
                    <Td ch={fmt(s.daily, 1) + "/d"} right color="text-yellow-300"/>
                    <td className="px-3 py-2.5 text-right whitespace-nowrap">
                      <span style={{
                        fontSize:12, padding:"2px 10px", borderRadius:99, fontWeight:700,
                        background: s.dias <= 0 ? "rgba(239,68,68,0.2)" : "rgba(239,68,68,0.12)",
                        color: "#F87171",
                        border: "1px solid rgba(239,68,68,0.3)"
                      }}>
                        {s.dias <= 0 ? "Agotado" : `${s.dias}d`}
                      </span>
                    </td>
                  </tr>
                ))}
              </tbody>
            </table>
          </div>
        </div>
      )}

      {/* Section 4: Actividad reciente proveedores */}
      {top4Suppliers.length > 0 && (
        <div className="bg-gray-900 border border-gray-700 rounded-xl overflow-hidden">
          <div className="px-4 py-3 border-b border-gray-700 flex items-center gap-2">
            <Package size={15} className="text-purple-400" />
            <span className="font-semibold text-white text-sm">Actividad reciente — Proveedores</span>
            <span className="text-xs text-gray-600 ml-1">— top 4 por compra total</span>
          </div>
          <div className="overflow-x-auto">
            <table className="w-full">
              <thead className="bg-gray-800/60">
                <tr>
                  <Th ch="Proveedor"/>
                  <Th ch="Total Comprado" right/>
                  <Th ch="Última Compra" right/>
                </tr>
              </thead>
              <tbody className="divide-y divide-gray-800/60">
                {top4Suppliers.map((s) => {
                  const d = daysSince(s.lastFecha);
                  const color = d === null ? "#6B7280" : d < 30 ? "#10B981" : d < 60 ? "#F59E0B" : "#EF4444";
                  return (
                    <tr key={s.prov} className="hover:bg-purple-900/20 transition-colors">
                      <td className="px-3 py-2.5 text-sm font-medium text-white max-w-[220px]">
                        <span className="block truncate">{s.prov}</span>
                      </td>
                      <Td ch={"$" + fmtM(s.totalC)} right color="text-purple-300" bold/>
                      <td style={{padding:"8px 12px",textAlign:"right"}}>
                        {s.lastFecha ? (
                          <span style={{display:"flex",alignItems:"center",justifyContent:"flex-end",gap:6}}>
                            <span style={{fontSize:11,color:"#9CA3AF"}}>{fmtDate(s.lastFecha)}</span>
                            <span style={{background:color+"22",color,border:`1px solid ${color}55`,
                              borderRadius:99,padding:"1px 7px",fontSize:11,fontWeight:600,whiteSpace:"nowrap"}}>
                              {d === 0 ? "hoy" : `hace ${d}d`}
                            </span>
                          </span>
                        ) : <span style={{color:"#6B7280"}}>-</span>}
                      </td>
                    </tr>
                  );
                })}
              </tbody>
            </table>
          </div>
        </div>
      )}
    </div>
  );
};

// ═══════════════════════════════════════════════
//  TAB 7 — INVENTARIO (Sprint 3)
// ═══════════════════════════════════════════════

const InventarioTab = ({ guiasData, ventasData }) => {
  // Use despachos (guías) as primary source, ventas as fallback
  const sourceData = guiasData.length > 0 ? guiasData : ventasData;
  const useGuias   = guiasData.length > 0;

  // Parse rows from either source — both share same column names
  const rows = useMemo(() =>
    sourceData.map(r => ({
      producto: col(r, "Producto"),
      cliente:  col(r, "Razón Social", "Razon Social"),
      fecha:    parseDate(col(r, "Fecha")),
      cantidad: parseNum(col(r, "Cantidad")),
      precio:   parseNum(col(r, "Precio Un.")),
    })).filter(r => r.fecha && r.producto && r.cliente),
  [sourceData]);

  // Date bounds from raw data
  const dateBounds = useMemo(() => {
    if (!rows.length) return { min: "", max: "" };
    let minT = Infinity, maxT = -Infinity;
    rows.forEach(r => { const t = r.fecha.getTime(); if (t < minT) minT = t; if (t > maxT) maxT = t; });
    const toInput = t => new Date(t).toISOString().slice(0, 10);
    return { min: toInput(minT), max: toInput(maxT) };
  }, [rows]);

  const [dateFrom, setDateFrom] = useState("");
  const [dateTo,   setDateTo]   = useState("");

  useEffect(() => {
    if (dateBounds.min && !dateFrom) setDateFrom(dateBounds.min);
    if (dateBounds.max && !dateTo)   setDateTo(dateBounds.max);
  }, [dateBounds.min, dateBounds.max]);

  const filteredRows = useMemo(() => {
    const from = dateFrom ? new Date(dateFrom) : null;
    const to   = dateTo   ? new Date(dateTo + "T23:59:59") : null;
    return rows.filter(r => {
      if (from && r.fecha < from) return false;
      if (to   && r.fecha > to)   return false;
      return true;
    });
  }, [rows, dateFrom, dateTo]);

  // Stock actual por producto (persisted)
  const [stockActual, setStockActual] = useState(() => {
    try { return JSON.parse(localStorage.getItem("gp_inv_stock_v1") || "{}"); }
    catch { return {}; }
  });
  useEffect(() => {
    try { localStorage.setItem("gp_inv_stock_v1", JSON.stringify(stockActual)); }
    catch {}
  }, [stockActual]);

  // Manual calzada overrides: producto → Set of eventKeys ("fecha_cliente_qty") marked as normal
  const [manualNormal, setManualNormal] = useState(() => {
    try {
      const raw = JSON.parse(localStorage.getItem("gp_inv_normal_v1") || "{}");
      const m = {};
      Object.keys(raw).forEach(k => { m[k] = new Set(raw[k]); });
      return m;
    } catch { return {}; }
  });
  useEffect(() => {
    try {
      const raw = {};
      Object.keys(manualNormal).forEach(k => { raw[k] = Array.from(manualNormal[k]); });
      localStorage.setItem("gp_inv_normal_v1", JSON.stringify(raw));
    } catch {}
  }, [manualNormal]);

  const toggleManualNormal = (producto, eventKey) => {
    setManualNormal(prev => {
      const next = { ...prev };
      const set  = new Set(next[producto] || []);
      set.has(eventKey) ? set.delete(eventKey) : set.add(eventKey);
      next[producto] = set;
      return next;
    });
  };

  // Derive date range from filtered data
  const { refDate, totalDays } = useMemo(() => {
    if (!filteredRows.length) return { refDate: new Date(), totalDays: 90 };
    let minT = Infinity, maxT = -Infinity;
    filteredRows.forEach(r => { const t = r.fecha.getTime(); if (t < minT) minT = t; if (t > maxT) maxT = t; });
    const rDate = new Date(maxT);
    const days  = Math.max(1, Math.round((maxT - minT) / 86400000));
    return { refDate: rDate, totalDays: days };
  }, [filteredRows]);
  const totalWeeks = totalDays / 7;

  // Core SKU analysis — framework 7/15/21 + detección de ventas calzadas
  const CALZADA_MULT = 3; // evento > 3× la mediana del SKU = venta calzada
  const DIAS_MIN  = 7;
  const DIAS_OBJ  = 15;
  const DIAS_MAX  = 21;

  const skuAnalysis = useMemo(() => {
    if (!filteredRows.length) return [];

    const skuMap = {};
    filteredRows.forEach(r => {
      const k = r.producto;
      if (!skuMap[k]) skuMap[k] = { producto: k, events: [], clientSet: new Set() };
      skuMap[k].events.push({ fecha: r.fecha, cliente: r.cliente, cantidad: r.cantidad || 1, precio: r.precio || 0 });
      if (r.cliente) skuMap[k].clientSet.add(r.cliente);
    });

    return Object.values(skuMap).map(sku => {
      const events        = [...sku.events].sort((a, b) => a.fecha - b.fecha);
      const uniqueClients = sku.clientSet.size;
      const prodNormal    = manualNormal[sku.producto] || new Set();

      // Clientes con compra en ≥2 meses distintos
      let consistentClients = 0;
      sku.clientSet.forEach(c => {
        const months = new Set(
          events.filter(e => e.cliente === c)
                .map(e => `${e.fecha.getFullYear()}-${e.fecha.getMonth()}`)
        );
        if (months.size >= 2) consistentClients++;
      });

      // ── Detección de ventas calzadas (3× mediana) + overrides manuales ─
      const sortedQty = [...events.map(e => e.cantidad)].sort((a, b) => a - b);
      const medianQty = sortedQty[Math.floor(sortedQty.length / 2)] || 1;
      const calzadaThreshold = medianQty * CALZADA_MULT;

      const evKey = e => `${e.fecha.toISOString().slice(0,10)}_${e.cliente}_${e.cantidad}`;

      // Auto-calzada si supera umbral Y no marcado manualmente como normal
      const calzadaEvents = events.filter(e => e.cantidad > calzadaThreshold && !prodNormal.has(evKey(e)));
      const normalEvents  = events.filter(e => e.cantidad <= calzadaThreshold || prodNormal.has(evKey(e)));
      const calzadaQty    = calzadaEvents.reduce((s, e) => s + e.cantidad, 0);

      let tipo;
      if (uniqueClients >= 3 && consistentClients >= 2 && events.length >= 8) {
        tipo = 'base';
      } else if (uniqueClients <= 1 || events.length <= 2) {
        tipo = 'calzado';
      } else {
        tipo = 'hibrido';
      }

      const baseQty         = normalEvents.reduce((s, e) => s + e.cantidad, 0);
      const baseDailyDemand = totalDays > 0 ? baseQty / totalDays : 0;

      const stockMin = tipo !== 'calzado' ? Math.ceil(baseDailyDemand * DIAS_MIN) : 0;
      const stockObj = tipo !== 'calzado' ? Math.ceil(baseDailyDemand * DIAS_OBJ) : 0;
      const stockMax = tipo !== 'calzado' ? Math.ceil(baseDailyDemand * DIAS_MAX) : 0;

      return {
        producto: sku.producto,
        uniqueClients,
        consistentClients,
        eventos:      events.length,
        eventosBase:  normalEvents.length,
        calzadaCount: calzadaEvents.length,
        calzadaQty,
        calzadaEvents,
        allEvents: events,      // needed for modal with overrides
        medianQty,
        calzadaThreshold,
        baseDailyDemand,
        tipo,
        stockMin,
        stockObj,
        stockMax,
      };
    }).sort((a, b) => {
      const order = { base: 0, hibrido: 1, calzado: 2 };
      if (order[a.tipo] !== order[b.tipo]) return order[a.tipo] - order[b.tipo];
      return b.stockObj - a.stockObj;
    });
  }, [filteredRows, totalDays, manualNormal]);

  const [filter, setFilter] = useState('todos'); // 'todos'|'base'|'hibrido'|'calzado'
  const [search, setSearch] = useState('');
  const invSort = useSort('stockObj', 'desc');
  const [calzadaModal, setCalzadaModal] = useState(null); // { producto, events, medianQty, threshold }

  // Unidades de medida: Loco Conserva → uns., resto → kgs.
  const getUnit = prod => /loco\s+conserva/i.test(prod) ? 'uns.' : 'kgs.';

  const filtered = useMemo(() => {
    let data = skuAnalysis;
    if (filter !== 'todos') data = data.filter(s => s.tipo === filter);
    if (search.trim()) {
      const q = normStr(search);
      data = data.filter(s => normStr(s.producto).includes(q));
    }
    return applySort(data, invSort.key, invSort.dir, (s, k) => s[k] ?? 0);
  }, [skuAnalysis, filter, search, invSort.key, invSort.dir]);

  const { page, go, totalPages, slice, total } = usePag(filtered, 50);

  const counts = useMemo(() => ({
    base:    skuAnalysis.filter(s => s.tipo === 'base').length,
    hibrido: skuAnalysis.filter(s => s.tipo === 'hibrido').length,
    calzado: skuAnalysis.filter(s => s.tipo === 'calzado').length,
  }), [skuAnalysis]);

  return (
    <div className="space-y-4">
      {/* ── Date filter ── */}
      <div className="flex gap-2 items-end flex-wrap">
        <div>
          <p className="text-xs mb-1" style={{color:"#444458"}}>Desde</p>
          <input type="date" value={dateFrom} min={dateBounds.min} max={dateBounds.max}
            onChange={e => setDateFrom(e.target.value)}
            className="px-2.5 py-2 rounded-lg text-sm"
            style={{background:"#0F0F16",border:"1px solid #21212E",outline:"none",color:"#E5E7EB"}}
            onFocus={e=>{e.target.style.borderColor="#3B4DE8";}}
            onBlur={e=>{e.target.style.borderColor="#21212E";}}/>
        </div>
        <div>
          <p className="text-xs mb-1" style={{color:"#444458"}}>Hasta</p>
          <input type="date" value={dateTo} min={dateBounds.min} max={dateBounds.max}
            onChange={e => setDateTo(e.target.value)}
            className="px-2.5 py-2 rounded-lg text-sm"
            style={{background:"#0F0F16",border:"1px solid #21212E",outline:"none",color:"#E5E7EB"}}
            onFocus={e=>{e.target.style.borderColor="#3B4DE8";}}
            onBlur={e=>{e.target.style.borderColor="#21212E";}}/>
        </div>
        <button type="button" onClick={() => { setDateFrom(dateBounds.min); setDateTo(dateBounds.max); }}
          className="text-xs text-gray-600 hover:text-blue-400 transition-colors pb-2.5">Restablecer</button>
        <span className="text-xs pb-2.5" style={{color:"#444458"}}>
          · {filteredRows.length.toLocaleString("es-CL")} despachos en {totalDays} días
        </span>
      </div>

      {/* ── Summary cards ── */}
      <div className="grid grid-cols-3 gap-3">
        <div className="card-hover bg-gray-800 border border-gray-700 rounded-xl p-4 cursor-pointer"
          style={filter==='base' ? {borderColor:'rgba(16,185,129,0.5)',background:'rgba(16,185,129,0.06)'} : {}}
          onClick={() => setFilter(filter==='base' ? 'todos' : 'base')}>
          <div className="text-xs font-medium uppercase tracking-widest mb-2" style={{color:"#10B981"}}>🟢 Base Fija</div>
          <div className="text-2xl font-bold tabular-nums text-emerald-300">{counts.base}</div>
          <div className="text-xs mt-1.5" style={{color:"#555570"}}>SKUs — mantener stock siempre</div>
        </div>

        <div className="card-hover bg-gray-800 border border-gray-700 rounded-xl p-4 cursor-pointer"
          style={filter==='hibrido' ? {borderColor:'rgba(245,158,11,0.5)',background:'rgba(245,158,11,0.06)'} : {}}
          onClick={() => setFilter(filter==='hibrido' ? 'todos' : 'hibrido')}>
          <div className="text-xs font-medium uppercase tracking-widest mb-2" style={{color:"#F59E0B"}}>🟡 Híbrido</div>
          <div className="text-2xl font-bold tabular-nums text-yellow-300">{counts.hibrido}</div>
          <div className="text-xs mt-1.5" style={{color:"#555570"}}>SKUs — monitorear y decidir</div>
        </div>

        <div className="card-hover bg-gray-800 border border-gray-700 rounded-xl p-4 cursor-pointer"
          style={filter==='calzado' ? {borderColor:'rgba(239,68,68,0.5)',background:'rgba(239,68,68,0.06)'} : {}}
          onClick={() => setFilter(filter==='calzado' ? 'todos' : 'calzado')}>
          <div className="text-xs font-medium uppercase tracking-widest mb-2" style={{color:"#EF4444"}}>🔴 Calzado</div>
          <div className="text-2xl font-bold tabular-nums text-red-300">{counts.calzado}</div>
          <div className="text-xs mt-1.5" style={{color:"#555570"}}>SKUs — solo con pedido confirmado</div>
        </div>
      </div>

      {/* ── Search ── */}
      <SearchBar value={search} onChange={v => { setSearch(v); go(0); }} placeholder="Buscar producto…" />

      {/* ── Table ── */}
      <div className="bg-gray-900 border border-gray-700 rounded-xl overflow-hidden">
        <div className="px-4 py-2.5 border-b border-gray-700 flex items-center justify-between">
          <span className="text-xs text-gray-500">
            {filtered.length} producto{filtered.length !== 1 ? 's' : ''}
            {filter !== 'todos' && ` — filtrado por ${filter}`}
            {' · '}fuente: <span style={{color:"#c88d31"}}>{useGuias ? 'despachos' : 'ventas'}</span>
          </span>
          <span className="text-xs text-gray-600">Marco KPI: <span style={{color:'#6B7280'}}>7d mín</span> · <span style={{color:'#34D399'}}>15d objetivo</span> · <span style={{color:'#6B7280'}}>21d máx</span> · umbral calzada: 3× mediana</span>
        </div>
        <div className="overflow-x-auto">
          <table className="w-full">
            <thead className="bg-gray-800/60">
              <tr>
                <th className="px-3 py-3 text-xs font-semibold text-gray-500 uppercase tracking-wider text-left whitespace-nowrap">Producto</th>
                <th className="px-3 py-3 text-xs font-semibold text-gray-500 uppercase tracking-wider text-left whitespace-nowrap">Tipo</th>
                <th onClick={() => invSort.toggle('uniqueClients')}

                <th onClick={() => invSort.toggle('stockObj')}

                <th className="px-3 py-3 text-xs font-semibold text-gray-500 uppercase tracking-wider text-right whitespace-nowrap">

            <tbody className="divide-y divide-gray-800/60">
              {slice.map(s => {

                  ? {bg:'rgba(245,158,11,0.12)',color:'#FBBF24',border:'rgba(245,158,11,0.3)',label:'Híbrido'}
                  : {bg:'rgba(239,68,68,0.12)',color:'#F87171',border:'rgba(239,68,68,0.3)',label:'Calzado'};

                // Stock actual → días cubiertos
                const stockVal  = parseFloat(stockActual[s.producto] || "") || 0;
                const diasCubiertos = stockVal > 0 && s.baseDailyDemand > 0
                  ? Math.round(stockVal / s.baseDailyDemand) : null;
                const stockColor = diasCubiertos == null ? "#4B5563"
                  : diasCubiertos < DIAS_MIN ? "#F87171"
                  : diasCubiertos > DIAS_MAX ? "#FBBF24"
                  : "#34D399";

                return (
                  <tr key={s.producto} className="hover:bg-blue-900/10 transition-colors">
                    <td className="px-3 py-2.5 text-sm font-medium text-white max-w-[260px]">
                      <span className="block truncate" title={s.producto}>{s.producto}</span>
                    </td>
                    <td className="px-3 py-2.5">
                      <span style={{
                        fontSize:11, padding:'2px 8px', borderRadius:99, fontWeight:700,
                        background: tipoBadge.bg, color: tipoBadge.color,
                        border: `1px solid ${tipoBadge.border}`,

                      }}>
                        {tipoBadge.label}

                    </td>
                    <Td ch={s.uniqueClients} right color="text-blue-300"/>
                    <Td ch={s.consistentClients} right color={s.consistentClients >= 2 ? "text-emerald-400" : "text-gray-500"}/>
                    <Td ch={s.eventosBase} right dim/>
                    <Td ch={s.baseDailyDemand > 0 ? fmt(s.baseDailyDemand, 1) + ' ' + getUnit(s.producto) : '—'} right color="text-yellow-300"/>
                    <td className="px-3 py-2.5 text-sm text-right whitespace-nowrap">
                      {s.tipo !== 'calzado'
                        ? <span className="inline-flex items-center gap-1 font-mono" style={{fontSize:12}}>

                            <span style={{color:'#374151',fontSize:10}}>·</span>
                            <span style={{color:'#6B7280'}}>{fmt(s.stockMax,0)}</span>
                            <span style={{color:'#4B5563',fontSize:10}}> {getUnit(s.producto)}</span>

        <p><span style={{color:'#FBBF24',fontWeight:700}}>🟡 Híbrido</span> — Patrón intermedio. Evaluar caso a caso; considerar mantener stock objetivo de 15 días.</p>

        const { producto, allEvents, medianQty, threshold } = calzadaModal;
        const unit      = getUnit(producto);
        const unitLabel = unit === 'uns.' ? 'unidades' : 'kilos';
        const prodNormalSet = manualNormal[producto] || new Set();
        const evKey = e => `${e.fecha.toISOString().slice(0,10)}_${e.cliente}_${e.cantidad}`;
        // Only show events that exceed threshold (auto-calzadas) — the user can toggle each
        const overThreshold = (allEvents || []).filter(e => e.cantidad > threshold).sort((a,b) => b.fecha - a.fecha);
        const grandTotalQty = overThreshold.reduce((s,e) => s + e.cantidad, 0);
        const grandTotalAmt = overThreshold.reduce((s,e) => s + e.cantidad * (e.precio||0), 0);
        const excludedQty   = overThreshold.filter(e => !prodNormalSet.has(evKey(e))).reduce((s,e) => s + e.cantidad, 0);
        const fmtD = d => d ? `${d.getDate().toString().padStart(2,'0')}/${(d.getMonth()+1).toString().padStart(2,'0')}/${d.getFullYear()}` : '—';
        const fmtCLP = n => n > 0 ? '$' + Math.round(n).toLocaleString('es-CL') : '—';

        // Group by client
        const porCliente = {};
        overThreshold.forEach(e => {
          if (!porCliente[e.cliente]) porCliente[e.cliente] = { cliente: e.cliente, eventos: [] };
          porCliente[e.cliente].eventos.push(e);
        });
        const clienteGroups = Object.values(porCliente).sort((a,b) =>
          b.eventos.reduce((s,e)=>s+e.cantidad,0) - a.eventos.reduce((s,e)=>s+e.cantidad,0)
        );

        return (
          <div style={{position:'fixed',inset:0,background:'rgba(0,0,0,0.75)',zIndex:1000,display:'flex',alignItems:'center',justifyContent:'center',padding:16}}
               onClick={() => setCalzadaModal(null)}>

              <div style={{padding:'16px 20px',borderBottom:'1px solid #1e1e2e',display:'flex',alignItems:'flex-start',justifyContent:'space-between',gap:12}}>
                <div>
                  <div style={{display:'flex',alignItems:'center',gap:8,marginBottom:4}}>
                    <span style={{fontSize:11,padding:'2px 8px',borderRadius:99,fontWeight:700,background:'rgba(139,92,246,0.15)',color:'#A78BFA',border:'1px solid rgba(139,92,246,0.3)'}}>
                      Ventas calzadas
                    </span>
                    <span style={{fontSize:11,color:'#4B5563'}}>umbral: &gt;{fmt(threshold,0)} {unit} (3× mediana {fmt(medianQty,0)} {unit})</span>
                  </div>
                  <div style={{fontSize:15,fontWeight:700,color:'#E5E7EB',lineHeight:1.3}}>{producto}</div>
                  <div style={{fontSize:12,color:'#6B7280',marginTop:3}}>
                    {overThreshold.length} evento{overThreshold.length!==1?'s':''} sobre umbral ·{' '}
                    <span style={{color:'#F87171'}}>{fmt(excludedQty,0)} {unit} excluidos</span>
                    {grandTotalAmt > 0 && <> · {fmtCLP(grandTotalAmt)}</>}
                  </div>
                </div>
                <button onClick={() => setCalzadaModal(null)}
                        style={{background:'rgba(255,255,255,0.05)',border:'1px solid #2a2a3a',borderRadius:8,padding:'4px 10px',color:'#9CA3AF',cursor:'pointer',fontSize:13,flexShrink:0}}>
                  ✕ Cerrar
                </button>
              </div>

              {/* Body */}
              <div style={{overflowY:'auto',padding:20,display:'flex',flexDirection:'column',gap:14}}>
                <p style={{fontSize:11,color:'#4B5563',marginBottom:4}}>
                  Activa <span style={{color:'#34D399',fontWeight:600}}>Incluir en base</span> para que un evento entre al cálculo de demanda normal (p.ej. si no fue realmente una venta calzada).
                </p>
                {clienteGroups.map(cg => {
                  const cgQty = cg.eventos.reduce((s,e)=>s+e.cantidad,0);
                  return (
                    <div key={cg.cliente} style={{background:'#0D0D14',border:'1px solid #1a1a28',borderRadius:12,overflow:'hidden'}}>
                      <div style={{padding:'9px 14px',background:'rgba(139,92,246,0.07)',borderBottom:'1px solid #1a1a28',display:'flex',alignItems:'center',justifyContent:'space-between'}}>
                        <span style={{fontSize:13,fontWeight:600,color:'#C4B5FD'}}>{cg.cliente}</span>
                        <span style={{fontSize:11,color:'#6B7280'}}>{cg.eventos.length} ev · {fmt(cgQty,0)} {unit}</span>
                      </div>
                      <table style={{width:'100%',borderCollapse:'collapse'}}>
                        <thead>
                          <tr style={{background:'rgba(255,255,255,0.02)'}}>
                            <th style={{padding:'6px 14px',fontSize:10,fontWeight:600,color:'#4B5563',textTransform:'uppercase',letterSpacing:'0.05em',textAlign:'left'}}>Fecha</th>
                            <th style={{padding:'6px 14px',fontSize:10,fontWeight:600,color:'#4B5563',textTransform:'uppercase',letterSpacing:'0.05em',textAlign:'right'}}>Cantidad</th>
                            <th style={{padding:'6px 14px',fontSize:10,fontWeight:600,color:'#4B5563',textTransform:'uppercase',letterSpacing:'0.05em',textAlign:'right'}}>Precio unit.</th>
                            <th style={{padding:'6px 14px',fontSize:10,fontWeight:600,color:'#4B5563',textTransform:'uppercase',letterSpacing:'0.05em',textAlign:'right'}}>Total</th>
                            <th style={{padding:'6px 14px',fontSize:10,fontWeight:600,color:'#4B5563',textTransform:'uppercase',letterSpacing:'0.05em',textAlign:'center'}}>¿Base?</th>
                          </tr>
                        </thead>
                        <tbody>
                          {cg.eventos.map((e, i) => {
                            const k       = evKey(e);
                            const isNorm  = prodNormalSet.has(k);
                            return (
                              <tr key={i} style={{borderTop:'1px solid #1a1a28', background: isNorm ? 'rgba(16,185,129,0.04)' : 'transparent'}}>
                                <td style={{padding:'7px 14px',fontSize:12,color:'#9CA3AF'}}>{fmtD(e.fecha)}</td>
                                <td style={{padding:'7px 14px',fontSize:13,fontWeight:700,color: isNorm ? '#6EE7B7' : '#A78BFA',textAlign:'right'}}>{fmt(e.cantidad,0)} {unit}</td>
                                <td style={{padding:'7px 14px',fontSize:12,color:'#6B7280',textAlign:'right'}}>{fmtCLP(e.precio)}</td>
                                <td style={{padding:'7px 14px',fontSize:12,color: e.precio>0?'#E5E7EB':'#4B5563',textAlign:'right'}}>{fmtCLP(e.cantidad*(e.precio||0))}</td>
                                <td style={{padding:'5px 14px',textAlign:'center'}}>
                                  <button
                                    onClick={() => toggleManualNormal(producto, k)}
                                    style={{
                                      fontSize:10, padding:'3px 9px', borderRadius:99, fontWeight:700, cursor:'pointer',
                                      background: isNorm ? 'rgba(16,185,129,0.15)' : 'rgba(255,255,255,0.04)',
                                      color:      isNorm ? '#34D399'                : '#4B5563',
                                      border:     isNorm ? '1px solid rgba(16,185,129,0.35)' : '1px solid #2a2a3a',
                                      transition: 'all 0.15s',
                                    }}>
                                    {isNorm ? '✓ En base' : 'Excluir'}
                                  </button>
                                </td>
                              </tr>
                            );
                          })}
                        </tbody>
                      </table>
                    </div>
                  );
                })}
              </div>

              {/* Footer */}
              <div style={{padding:'12px 20px',borderTop:'1px solid #1e1e2e',display:'flex',alignItems:'center',justifyContent:'space-between',gap:12}}>
                <span style={{fontSize:11,color:'#4B5563',flex:1}}>
                  Los eventos en <span style={{color:'#F87171'}}>rojo/violeta</span> se excluyen de la demanda base. Los marcados en <span style={{color:'#34D399'}}>verde</span> se incluyen.
                </span>
                <div style={{display:'flex',gap:16,textAlign:'right',flexShrink:0}}>
                  <div>
                    <div style={{fontSize:10,color:'#4B5563',textTransform:'uppercase',letterSpacing:'0.05em'}}>Total sobre umbral</div>
                    <div style={{fontSize:15,fontWeight:700,color:'#A78BFA'}}>{fmt(grandTotalQty,0)} {unit}</div>
                  </div>
                  {grandTotalAmt > 0 && <div>
                    <div style={{fontSize:10,color:'#4B5563',textTransform:'uppercase',letterSpacing:'0.05em'}}>Monto total</div>
                    <div style={{fontSize:15,fontWeight:700,color:'#E5E7EB'}}>{fmtCLP(grandTotalAmt)}</div>
                  </div>}
                </div>
              </div>
            </div>
          </div>
        );
      })()}
    </div>
  );
};

const EmptyState = ({ msg, icon }) => (
  <div className="flex flex-col items-center justify-center py-24 gap-4">
    <div className="p-5 rounded-2xl" style={{background:"rgba(255,255,255,0.03)",border:"1px solid #1a1a28",color:"#2a2a40"}}>
      {icon}
    </div>
    <div className="text-center">
      <p className="text-sm font-medium" style={{color:"#444458"}}>{msg}</p>
      <p className="text-xs mt-1" style={{color:"#2a2a38"}}>Carga un archivo desde el botón "Agregar archivos"</p>
    </div>
  </div>
);

function App() {
  // ── Auth ────────────────────────────────────────────────────────
  const [authState,   setAuthState]   = useState('checking'); // 'checking'|'setup'|'login'|'authenticated'
  const [accessLevel, setAccessLevel] = useState(null);       // 'admin'|'user'
  const masterKeyRef   = useRef(null);  // CryptoKey en memoria — nunca en estado/localStorage
  const accessLevelRef = useRef(null);  // Ref para acceso desde callbacks

  // ── Data ────────────────────────────────────────────────────────
  const [rawData,    setRawData]    = useState({ ventas: [], guias: [], compras: [] });
  const [detected,   setDetected]   = useState({ ventas: null, guias: null, compras: null, preciosCount: 0 });
  const [loading,    setLoading]    = useState(false);
  const [loaded,     setLoaded]     = useState(false);
  const [activeTab,  setActiveTab]  = useState(0);
  const [priceQueue, setPriceQueue] = useState({ files: [], version: 0 });
  const [precioRows,  setPrecioRows]  = useState(SEED_PRECIOS.rows  || []);
  const [precioCards, setPrecioCards] = useState(SEED_PRECIOS.cards || []);

  const datePeriod = useMemo(() => {
    if (!rawData.ventas.length) return null;
    let min = Infinity, max = -Infinity;
    rawData.ventas.forEach(r => {
      const d = parseDate(col(r, "Fecha"));
      if (d) { const t = d.getTime(); if (t < min) min = t; if (t > max) max = t; }
    });
    if (!isFinite(min)) return null;
    return { from: new Date(min), to: new Date(max) };
  }, [rawData.ventas]);

  // ── Init: determinar pantalla ────────────────────────────────────
  useEffect(() => {
    // Si no hay config local pero hay SEED_META en el HTML → inicializar localStorage
    if (!localStorage.getItem('gp_meta_v1') && SEED_META) {
      try { localStorage.setItem('gp_meta_v1', JSON.stringify(SEED_META)); } catch(e) {}
    }
    setAuthState(GpCrypto.isSetupDone() ? 'login' : 'setup');
  }, []);

  // ── Handler compartido para setup y login ────────────────────────
  // Todos los setters van DESPUÉS del await para que React 18
  // los agrupe en un único re-render y no haya estados intermedios inválidos.
  const handleAuth = useCallback(async ({ masterKey, level }) => {
    masterKeyRef.current = masterKey;
    try {
      const [ventas, guias, compras, precios] = await Promise.all([
        GpCrypto.loadModule('ventas',  masterKey),
        GpCrypto.loadModule('guias',   masterKey),
        GpCrypto.loadModule('compras', masterKey),
        GpCrypto.loadModule('precios', masterKey),
      ]);
      // Fallback a SEED_DATA / SEED_PRECIOS si no hay datos encriptados en localStorage
      const newData = {
        ventas:  ventas  ?? SEED_DATA.ventas,
        guias:   guias   ?? SEED_DATA.guias,
        compras: compras ?? SEED_DATA.compras,
      };
      const newPrecios = precios ?? SEED_PRECIOS;
      const hasAny  = Object.values(newData).some(d => d.length > 0);

      // Todos los updates en la misma microtarea → React los agrupa en 1 render
      accessLevelRef.current = level;
      setAccessLevel(level);
      setRawData(newData);
      setPrecioRows(newPrecios.rows  || []);
      setPrecioCards(newPrecios.cards || []);
      if (hasAny) {
        setDetected({
          ventas:  newData.ventas.length  ? `${newData.ventas.length} filas`  : null,
          guias:   newData.guias.length   ? `${newData.guias.length} filas`   : null,
          compras: newData.compras.length ? `${newData.compras.length} filas` : null,
          preciosCount: (newPrecios.cards || []).length,
        });
        setLoaded(true);
      }
      setAuthState('authenticated'); // dispara el render final del dashboard
    } catch(e) {
      console.error('handleAuth error:', e);
      // Incluso si falla la carga de datos, mostramos el dashboard
      accessLevelRef.current = level;
      setAccessLevel(level);
      setAuthState('authenticated');
    }
  }, []);

  // ── Persistencia encriptada por módulo ───────────────────────────
  useEffect(() => {
    if (!masterKeyRef.current) return;
    if (!Object.values(rawData).some(d => d.length > 0)) return;
    ['ventas','guias','compras'].forEach(name => {
      if (rawData[name].length > 0)
        GpCrypto.saveModule(name, rawData[name], masterKeyRef.current);
    });
  }, [rawData]);

  useEffect(() => {
    if (!masterKeyRef.current) return;
    if (precioRows.length === 0 && precioCards.length === 0) return;
    GpCrypto.saveModule('precios', { rows: precioRows, cards: precioCards }, masterKeyRef.current);
  }, [precioRows, precioCards]);

  // ── Exportar configuración completa: lee el propio index.html (vía file picker,
  //    ya que fetch() no funciona con file://) e inyecta SEED_META/SEED_PRECIOS/SEED_DATA ──
  const exportFileRef = useRef(null);
  const handleExportConfig = useCallback(async (e) => {
    const file = e.target.files?.[0];
    e.target.value = '';
    if (!file) return;
    const metaRaw = localStorage.getItem('gp_meta_v1') || (SEED_META ? JSON.stringify(SEED_META) : null);
    if (!metaRaw) { alert('No hay configuración de PINs guardada aún.'); return; }
    try {
      const meta        = JSON.parse(metaRaw);
      const seedData    = { ventas: rawData.ventas, guias: rawData.guias, compras: rawData.compras };
      const seedPrecios = { rows: precioRows, cards: precioCards };

      // Los datos se guardan como texto (JSON.parse de un string) en vez de objetos
      // literales: Babel debe transpilar este script en el navegador, y parsear miles
      // de objetos/arrays literales es mucho más lento que parsear un único string y
      // dejar que JSON.parse (nativo) haga el trabajo pesado.
      let html = await file.text();
      html = html.replace(/const SEED_META = [\s\S]*?;\n/,
        () => `const SEED_META = JSON.parse(${JSON.stringify(JSON.stringify(meta))});\n`);
      html = html.replace(/const SEED_PRECIOS = [\s\S]*?;\n/,
        () => `const SEED_PRECIOS = JSON.parse(${JSON.stringify(JSON.stringify(seedPrecios))});\n`);
      html = html.replace(/const SEED_DATA = [\s\S]*?;\n/,
        () => `const SEED_DATA = JSON.parse(${JSON.stringify(JSON.stringify(seedData))});\n`);

      const blob = new Blob([html], { type: 'text/html' });
      const url  = URL.createObjectURL(blob);
      const a    = document.createElement('a');
      a.href = url; a.download = 'index.html';
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      setTimeout(() => URL.revokeObjectURL(url), 1000);
    } catch(err) {
      console.error('export error:', err);
      alert('Error al exportar la configuración: ' + err.message);
    }
  }, [rawData, precioRows, precioCards]);

  // ── handleFiles ANTES de cualquier return condicional (Rules of Hooks) ──
  const handleFiles = useCallback(async (fileList) => {
    if (accessLevelRef.current !== 'admin') return;
    setLoading(true);
    const dataUpdates = {};
    const nameUpdates = {};
    const priceFiles  = [];
    for (const file of Array.from(fileList)) {
      const n = file.name.toLowerCase();
      let key = null;
      if      (n.includes("venta"))                          key = "ventas";
      else if (n.includes("guia") || n.includes("despacho")) key = "guias";
      else if (n.includes("compra"))                         key = "compras";
      if (key) {
        nameUpdates[key] = file.name;
        dataUpdates[key] = parseCSVText(await file.text());
      } else {
        priceFiles.push(file);
      }
    }
    if (Object.keys(dataUpdates).length > 0) {
      setRawData((prev)  => ({ ...prev, ...dataUpdates  }));
      setDetected((prev) => ({ ...prev, ...nameUpdates  }));
    }
    if (priceFiles.length > 0) {
      setDetected((prev) => ({ ...prev, preciosCount: (prev.preciosCount || 0) + priceFiles.length }));
      setPriceQueue((prev) => ({ files: priceFiles, version: prev.version + 1 }));
    }
    setLoading(false);
    setLoaded(true);
  }, []);

  // ── Pantallas de autenticación (returns condicionales — van DESPUÉS de todos los hooks) ──
  if (authState === 'checking') return (
    <div className="min-h-screen flex items-center justify-center" style={{background:'#0A0A0F'}}>
      <Loader2 size={28} className="animate-spin" style={{color:'#c88d31'}}/>
    </div>
  );
  if (authState === 'setup') return <SetupScreen onSetup={handleAuth}/>;
  if (authState === 'login') return <LoginScreen onLogin={handleAuth}/>;

  // A partir de aquí: autenticado
  const isAdmin = accessLevel === 'admin';

  const hasData = Object.values(rawData).some((d) => d.length > 0) || priceQueue.version > 0;

  const TABS = [
    { label: "Resumen",        icon: <BarChart2    size={15} />, count: null                                       },
    { label: "Precios",        icon: <DollarSign   size={15} />, count: null                                       },
    { label: "Inventario",     icon: <Package      size={15} />, count: rawData.guias.length || rawData.ventas.length },
    { label: "Compras",        icon: <Package      size={15} />, count: rawData.compras.length                     },
    { label: "Venta/Producto", icon: <BarChart2    size={15} />, count: rawData.ventas.length                      },
    { label: "Ventas/Cliente", icon: <TrendingUp   size={15} />, count: rawData.ventas.length                      },
  ];

  if (!loaded) return isAdmin
    ? (
      <UploadScreen
        onFiles={handleFiles}
        loading={loading}
        detected={detected}
        hasData={hasData}
        onBack={() => setLoaded(true)}
      />
    ) : (
      // Usuario sin datos: no puede cargar archivos
      <div className="min-h-screen flex flex-col items-center justify-center p-6"
        style={{ background:'#0A0A0F', position:'relative' }}>
        <LogoBg/>
        <div style={{position:'relative',zIndex:1,textAlign:'center',maxWidth:360}}>
          <GestapackLogo height={40}/>
          <p className="text-sm mt-8 font-medium" style={{color:'#555570'}}>
            No hay datos disponibles aún.
          </p>
          <p className="text-xs mt-2" style={{color:'#333345'}}>
            Solicita al administrador que cargue los archivos de datos.
          </p>
        </div>
      </div>
    );

  return (
    <div className="min-h-screen text-gray-100" style={{ background: "#0A0A0F", position: "relative" }}>
      <LogoBg />

      {/* ── Sticky nav ──────────────────────────────── */}
      <div className="sticky top-0 z-10 border-b px-5 py-3"
        style={{
          background:     "rgba(10,10,15,0.97)",
          backdropFilter: "blur(16px)",
          borderColor:    "#1A1A26",
        }}>
        <div className="flex items-center justify-between mb-3">
          <div className="flex items-center gap-3">
            <GestapackLogo height={26} />
            <div className="w-px h-4 bg-gray-800" />
            <span className="text-xs font-medium tracking-widest uppercase" style={{ color: "#5a4010", letterSpacing: "0.2em" }}>Dashboard Comercial</span>
            {datePeriod && loaded && (
              <span className="text-xs tabular-nums" style={{color:"#444458"}}>
                {fmtDate(datePeriod.from)} – {fmtDate(datePeriod.to)}
              </span>
            )}
          </div>

          {/* Botones solo visibles para admin — no renderizados para usuario */}
          {isAdmin && (
            <>
              <input ref={exportFileRef} type="file" accept=".html" className="hidden" onChange={handleExportConfig} />
              <button
                onClick={() => {
                  if (!localStorage.getItem('gp_meta_v1') && !SEED_META) { alert('No hay configuración de PINs guardada aún.'); return; }
                  exportFileRef.current?.click();
                }}
                className="flex items-center gap-1.5 text-xs px-3 py-1.5 rounded-lg transition-all"
                style={{ color:"#A78BFA", border:"1px solid rgba(167,139,250,0.25)", background:"rgba(167,139,250,0.06)" }}
                onMouseEnter={e=>{ e.currentTarget.style.background="rgba(167,139,250,0.14)"; e.currentTarget.style.borderColor="rgba(167,139,250,0.45)"; }}
                onMouseLeave={e=>{ e.currentTarget.style.background="rgba(167,139,250,0.06)"; e.currentTarget.style.borderColor="rgba(167,139,250,0.25)"; }}
              >
                <Download size={12}/> Exportar configuración completa
              </button>
            </>
          )}
          {isAdmin && (
            <button
              onClick={() => setLoaded(false)}
              className="flex items-center gap-1.5 text-xs px-3 py-1.5 rounded-lg transition-all"
              style={{ color:"#c88d31", border:"1px solid rgba(200,141,49,0.25)", background:"rgba(200,141,49,0.06)" }}
              onMouseEnter={e=>{ e.currentTarget.style.background="rgba(200,141,49,0.14)"; e.currentTarget.style.borderColor="rgba(200,141,49,0.45)"; }}
              onMouseLeave={e=>{ e.currentTarget.style.background="rgba(200,141,49,0.06)"; e.currentTarget.style.borderColor="rgba(200,141,49,0.25)"; }}
            >
              <Upload size={12}/> Agregar archivos
            </button>
          )}
          {isAdmin && loaded && (
            <button onClick={() => {
              GpCrypto.clearAll();
              setRawData({ventas:[],guias:[],compras:[]});
              setDetected({ventas:null,guias:null,compras:null,preciosCount:0});
              setLoaded(false);
              setPriceQueue({files:[],version:0});
              setPrecioRows([]);
              setPrecioCards([]);
            }}
            className="flex items-center gap-1.5 text-xs px-3 py-1.5 rounded-lg transition-all"
            style={{color:"#6B7280",border:"1px solid rgba(107,114,128,0.25)",background:"transparent"}}
            onMouseEnter={e=>{e.currentTarget.style.color="#EF4444";e.currentTarget.style.borderColor="rgba(239,68,68,0.4)";}}
            onMouseLeave={e=>{e.currentTarget.style.color="#6B7280";e.currentTarget.style.borderColor="rgba(107,114,128,0.25)";}}>
            <X size={12}/> Limpiar
            </button>
          )}
        </div>

        {/* Tabs — grupo Análisis / separador / grupo Operacional */}
        <div className="flex items-center gap-1 flex-wrap">
          {TABS.map((t, i) => {
            const isActive = activeTab === i;
            // Divisor visual entre tab 3 (Proveedores) y tab 4 (Optimizador)
            const showDivider = i === 4;
            return (
              <React.Fragment key={i}>
                {showDivider && (
                  <div className="w-px h-5 mx-1" style={{background:"#1e1e2e"}} />
                )}
                <button onClick={() => setActiveTab(i)}
                  className="flex items-center gap-1.5 px-3 py-1.5 rounded-lg text-xs font-semibold transition-all"
                  style={isActive ? {
                    background: "rgba(200,141,49,0.15)",
                    border:     "1px solid rgba(200,141,49,0.45)",
                    color:      "#c88d31",
                  } : {
                    background: "transparent",
                    border:     "1px solid transparent",
                    color:      "#666680",
                  }}
                  onMouseEnter={(e) => {
                    if (!isActive) { e.currentTarget.style.color = "#c88d31"; e.currentTarget.style.background = "rgba(200,141,49,0.07)"; }
                  }}
                  onMouseLeave={(e) => {
                    if (!isActive) { e.currentTarget.style.color = "#666680"; e.currentTarget.style.background = "transparent"; }
                  }}
                >
                  {t.icon} {t.label}
                  {t.count != null && t.count > 0 && (
                    <span className="px-1.5 py-0.5 rounded-full text-xs tabular-nums"
                      style={{
                        background: isActive ? "rgba(200,141,49,0.25)" : "rgba(255,255,255,0.05)",
                        color:      isActive ? "#c88d31" : "#555568",
                      }}>
                      {t.count.toLocaleString("es-CL")}
                    </span>
                  )}
                  {t.isNew && !isActive && (
                    <span className="px-1.5 py-0.5 rounded-full text-xs"
                      style={{ background: "rgba(16,185,129,0.12)", color: "#34D399", border: "1px solid rgba(16,185,129,0.25)" }}>
                      NUEVO
                    </span>
                  )}
                </button>
              </React.Fragment>
            );
          })}
        </div>
      </div>

      {/* Tab content */}
      <div className="p-5 max-w-screen-2xl mx-auto">
        {activeTab === 0 && (rawData.ventas.length > 0 || rawData.compras.length > 0
          ? <ResumenTab ventasData={rawData.ventas} guiasData={rawData.guias} comprasData={rawData.compras} />
          : <EmptyState msg="Carga datos para ver el resumen" icon={<BarChart2 size={48}/>}/>
        )}
        <div style={{display: activeTab === 1 ? "block" : "none"}}>
          <PreciosTab pendingFiles={priceQueue} allRows={precioRows} setAllRows={setPrecioRows} fileCards={precioCards} setFileCards={setPrecioCards} comprasData={rawData.compras} />
        </div>
        {activeTab === 2 && (rawData.guias.length > 0 || rawData.ventas.length > 0
          ? <InventarioTab guiasData={rawData.guias} ventasData={rawData.ventas} />
          : <EmptyState msg="Carga datos de ventas o despachos para ver el análisis de inventario" icon={<Package size={48}/>}/>
        )}
        {activeTab === 3 && (rawData.compras.length > 0
          ? <ComprasTab data={rawData.compras} ventasData={rawData.ventas} />
          : <EmptyState msg="No se detectó archivo de compras" icon={<Package size={48} />} />)}
        {activeTab === 4 && (rawData.ventas.length > 0
          ? <ProductosErrorBoundary><ProductosTab data={rawData.ventas} /></ProductosErrorBoundary>
          : <EmptyState msg="No se detectó archivo de ventas" icon={<BarChart2 size={48} />} />)}
        {activeTab === 5 && (rawData.ventas.length > 0
          ? <VentasTab data={rawData.ventas} guiasData={rawData.guias} />
          : <EmptyState msg="No se detectó archivo de ventas" icon={<TrendingUp size={48} />} />)}
      </div>
    </div>
  );
}

import { createRoot } from "react-dom/client";
createRoot(document.getElementById("root")).render(React.createElement(App));

  </script>
</body>
</html>
