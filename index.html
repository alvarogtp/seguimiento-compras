// ═══════════════════════════════════════════════
//  WEB CRYPTO — encriptación AES-GCM + PBKDF2
// ═══════════════════════════════════════════════

const GpCrypto = (() => {
  const META_KEY = 'gp_meta_v1';
  const MOD_KEY  = n => `gp_enc_${n}`;

  const b64enc = ab => btoa(String.fromCharCode(...new Uint8Array(ab)));
  const b64dec = b64 => Uint8Array.from(atob(b64), c => c.charCodeAt(0));

  // Derivar clave AES-GCM desde PIN + salt usando PBKDF2
  async function derivePinKey(pin, salt) {
    const km = await crypto.subtle.importKey(
      'raw', new TextEncoder().encode(pin), 'PBKDF2', false, ['deriveKey']
    );
    return crypto.subtle.deriveKey(
      { name: 'PBKDF2', salt, iterations: 200000, hash: 'SHA-256' },
      km, { name: 'AES-GCM', length: 256 }, false, ['encrypt', 'decrypt']
    );
  }

  // Cifrar bytes con clave AES-GCM (devuelve base64: iv + ciphertext)
  async function encBytes(data, key) {
    const iv = crypto.getRandomValues(new Uint8Array(12));
    const ct = await crypto.subtle.encrypt({ name: 'AES-GCM', iv }, key, data);
    const out = new Uint8Array(12 + ct.byteLength);
    out.set(iv); out.set(new Uint8Array(ct), 12);
    return b64enc(out.buffer);
  }

  // Descifrar bytes
  async function decBytes(b64, key) {
    const d = b64dec(b64);
    return crypto.subtle.decrypt({ name: 'AES-GCM', iv: d.slice(0,12) }, key, d.slice(12));
  }

  // Cifrar/descifrar JSON
  async function encJSON(data, key) {
    return encBytes(new TextEncoder().encode(JSON.stringify(data)), key);
  }
  async function decJSON(b64, key) {
    return JSON.parse(new TextDecoder().decode(await decBytes(b64, key)));
  }

  return {
    isSetupDone() { return !!localStorage.getItem(META_KEY) || (SEED_META !== null && SEED_META !== undefined); },

    // Primera configuración: genera master key y la cifra con ambos PINs
    async setup(adminPin, userPin) {
      const salt = crypto.getRandomValues(new Uint8Array(16));
      const mk   = await crypto.subtle.generateKey(
        { name: 'AES-GCM', length: 256 }, true, ['encrypt', 'decrypt']
      );
      const mkRaw = await crypto.subtle.exportKey('raw', mk);
      const [aKey, uKey] = await Promise.all([
        derivePinKey(adminPin, salt),
        derivePinKey(userPin,  salt),
      ]);
      const [aMK, uMK] = await Promise.all([
        encBytes(mkRaw, aKey),
        encBytes(mkRaw, uKey),
      ]);
      localStorage.setItem(META_KEY, JSON.stringify({
        salt: b64enc(salt.buffer), aMK, uMK,
      }));
      return { masterKey: mk, level: 'admin' };
    },

    // Login: intenta admin primero, luego usuario. Devuelve null si PIN incorrecto.
    async login(pin) {
      const meta = JSON.parse(localStorage.getItem(META_KEY) || 'null');
      if (!meta) return null;
      const salt   = b64dec(meta.salt);
      const pinKey = await derivePinKey(pin, salt);
      for (const [encMK, level] of [[meta.aMK,'admin'],[meta.uMK,'user']]) {
        try {
          const mkRaw    = await decBytes(encMK, pinKey);
          const masterKey = await crypto.subtle.importKey(
            'raw', mkRaw, { name: 'AES-GCM' }, true, ['encrypt','decrypt']
          );
          return { masterKey, level };
        } catch(e) { /* prueba el siguiente */ }
      }
      return null;
    },

    // Guardar/cargar módulo encriptado
    async saveModule(name, data, masterKey) {
      try { localStorage.setItem(MOD_KEY(name), await encJSON(data, masterKey)); }
      catch(e) { console.warn('gp save error:', e); }
    },
    async loadModule(name, masterKey) {
      const b64 = localStorage.getItem(MOD_KEY(name));
      if (!b64) return null;
      try { return await decJSON(b64, masterKey); } catch(e) { return null; }
    },

    // Borrar todo (meta + módulos)
    clearAll() {
      [META_KEY, MOD_KEY('ventas'), MOD_KEY('guias'), MOD_KEY('compras'), MOD_KEY('precios'),
       'gp_dashboard_v2' /* legacy */].forEach(k => {
        try { localStorage.removeItem(k); } catch(e) {}
      });
    },
  };
})();

const parseNum = (v) => {
  if (v == null || v === "" || v === "-") return 0;
  if (typeof v === "number") return isNaN(v) ? 0 : v;
  let s = String(v).trim().replace(/[$\s%]/g, "");

  const hasDot   = s.includes(".");
  const hasComma = s.includes(",");

  if (hasDot && hasComma) {
    // Both separators present → last one is the decimal
    if (s.lastIndexOf(".") > s.lastIndexOf(",")) {
      s = s.replace(/,/g, "");                       // US:    1,234.56
    } else {
      s = s.replace(/\./g, "").replace(",", ".");   // Latin: 1.234,56
    }
  } else if (hasComma && !hasDot) {
    // Only comma: 3 digits after → thousands (1,500); else → decimal (1,5)
    const after = s.split(",").pop();
    s = after.length === 3 ? s.replace(/,/g, "") : s.replace(",", ".");
  } else if (hasDot && !hasComma) {
    // Only dot: 3 digits after → Latin thousands (1.500); else → decimal (1.5)
    const after = s.split(".").pop();
    if (after.length === 3) s = s.replace(/\./g, "");
  }

  const n = parseFloat(s);
  return isNaN(n) ? 0 : n;
};

const fmt = (n, dec = 0) => {
  if (n == null || isNaN(n)) return "-";
  return new Intl.NumberFormat("es-CL", {
    minimumFractionDigits: dec,
    maximumFractionDigits: dec,
  }).format(n);
};
const fmtM   = (n) => fmt(n, 0);
const fmtPct = (n) => (!isFinite(n) || isNaN(n) ? "-" : fmt(n, 1) + "%");

const parseDate = (s) => {
  if (!s) return null;
  const str = String(s).trim();
  // Excel serial date number
  const serial = parseFloat(str);
  if (!isNaN(serial) && serial > 25569 && serial < 60000) {
    return new Date(Math.round((serial - 25569) * 86400 * 1000));
  }
  // Split by / - .
  const p = str.split(/[\/\-\.]/);
  if (p.length === 3) {
    if (p[2].length === 4) {
      // DD/MM/YYYY or DD-MM-YYYY
      const d = new Date(+p[2], +p[1] - 1, +p[0]);
      if (!isNaN(d.getTime())) return d;
    }
    if (p[0].length === 4) {
      // YYYY-MM-DD
      const d = new Date(+p[0], +p[1] - 1, +p[2]);
      if (!isNaN(d.getTime())) return d;
    }
  }
  // Fallback: native Date parse
  const d = new Date(str);
  return isNaN(d.getTime()) ? null : d;
};
const fmtDate = (d) => {
  if (!d) return "";
  return [
    String(d.getDate()).padStart(2, "0"),
    String(d.getMonth() + 1).padStart(2, "0"),
    d.getFullYear(),
  ].join("/");
};

const parseCSVText = (text) => {
  const lines = text.split(/\r?\n/).filter(Boolean);
  if (!lines.length) return [];
  // Find the real header row: first row with 3+ delimited columns
  // (skips metadata rows at top like "INFORME DE VENTAS", "PERIODO:", etc.)
  let headerIdx = 0;
  let delim = ";";
  for (let i = 0; i < Math.min(15, lines.length); i++) {
    const line = lines[i].replace(/^\uFEFF/, "");
    const tabs   = (line.match(/\t/g) || []).length;
    const semis  = (line.match(/;/g)  || []).length;
    const commas = (line.match(/,/g)  || []).length;
    if (tabs >= 3)  { delim = "\t"; headerIdx = i; break; }
    if (semis >= 3) { delim = ";";  headerIdx = i; break; }
    if (commas >= 3){ delim = ",";  headerIdx = i; break; }
  }
  const headers = lines[headerIdx].replace(/^\uFEFF/, "")
    .split(delim).map((h) => h.trim().replace(/^"|"$/g, ""));
  const result = [];
  for (let i = headerIdx + 1; i < lines.length; i++) {
    const vals = lines[i].split(delim);
    if (vals.every((v) => !v.trim())) continue;
    const row = {};
    headers.forEach((h, j) => { row[h] = (vals[j] || "").trim().replace(/^"|"$/g, ""); });
    result.push(row);
  }
  return result;
};

const col = (row, ...keys) => {
  for (const k of keys) {
    const found = Object.keys(row).find(
      (rk) => rk.toLowerCase().trim() === k.toLowerCase().trim()
    );
    if (found !== undefined && row[found] !== undefined) return row[found];
  }
  return "";
};

// ═══════════════════════════════════════════════
//  PERIODS
// ═══════════════════════════════════════════════

const s0  = (d) => { const r = new Date(d); r.setHours(0, 0, 0, 0);     return r; };
const e23 = (d) => { const r = new Date(d); r.setHours(23, 59, 59, 999); return r; };

const getWeekStart = (d) => {
  const day = d.getDay();
  const r   = new Date(d);
  r.setDate(d.getDate() - (day === 0 ? 6 : day - 1));
  return s0(r);
};

const getPeriods = (ref) => {
  const today      = e23(ref);
  const weekStart  = getWeekStart(ref);
  const weekEnd    = new Date(weekStart);
  weekEnd.setDate(weekStart.getDate() + 6); e23(weekEnd);
  const monthStart  = new Date(ref.getFullYear(), ref.getMonth(), 1);
  const monthEnd    = new Date(ref.getFullYear(), ref.getMonth() + 1, 0, 23, 59, 59, 999);
  const roll30Start = s0(new Date(ref.getFullYear(), ref.getMonth(), ref.getDate() - 29));
  const qMonth      = Math.floor(ref.getMonth() / 3) * 3;
  const qStart      = new Date(ref.getFullYear(), qMonth, 1);
  const qEnd        = new Date(ref.getFullYear(), qMonth + 3, 0, 23, 59, 59, 999);
  const roll90Start = s0(new Date(ref.getFullYear(), ref.getMonth(), ref.getDate() - 89));
  return { weekStart, weekEnd, monthStart, monthEnd, roll30Start, qStart, qEnd, roll90Start, today };
};

const inR = (date, start, end) => date >= start && date <= end;

// ═══════════════════════════════════════════════
//  SORT
// ═══════════════════════════════════════════════

const useSort = (initKey = null, initDir = "desc") => {
  const [st, setSt] = useState({ key: initKey, dir: initDir });
  const toggle = useCallback((k) => {
    setSt((p) => ({ key: k, dir: p.key === k && p.dir === "desc" ? "asc" : "desc" }));
  }, []);
  return { ...st, toggle };
};

const applySort = (data, key, dir, accessor) => {
  if (!key) return data;
  return [...data].sort((a, b) => {
    let va = accessor ? accessor(a, key) : a[key];
    let vb = accessor ? accessor(b, key) : b[key];
    if (typeof va === "string") va = va.toLowerCase();
    if (typeof vb === "string") vb = vb.toLowerCase();
    va = va ?? 0; vb = vb ?? 0;
    if (va < vb) return dir === "asc" ? -1 : 1;
    if (va > vb) return dir === "asc" ?  1 : -1;
    return 0;
  });
};

// ═══════════════════════════════════════════════
//  PAGINATION
// ═══════════════════════════════════════════════

const usePag = (data, size = 50) => {
  const [page, setPage] = useState(0);
  const totalPages = Math.max(1, Math.ceil(data.length / size));
  const safePage   = Math.min(page, totalPages - 1);
  const slice      = data.slice(safePage * size, (safePage + 1) * size);
  const go = useCallback(
    (p) => setPage(Math.max(0, Math.min(p, Math.max(0, Math.ceil(data.length / size) - 1)))),
    [data.length, size]
  );
  return { page: safePage, go, totalPages, slice, total: data.length };
};

// ═══════════════════════════════════════════════
//  PANTALLA DE LOGIN
// ═══════════════════════════════════════════════

const LoginScreen = ({ onLogin }) => {
  const [pin,     setPin]     = useState('');
  const [error,   setError]   = useState('');
  const [loading, setLoading] = useState(false);

  const submit = async () => {
    if (pin.length < 4) { setError('El PIN debe tener al menos 4 dígitos'); return; }
    setLoading(true); setError('');
    try {
      const result = await GpCrypto.login(pin);
      if (result) { onLogin(result); }
      else { setError('PIN incorrecto'); setPin(''); }
    } catch(e) { setError('Error al verificar'); }
    setLoading(false);
  };

  return (
    <div className="min-h-screen flex flex-col items-center justify-center p-6"
      style={{ background: '#0A0A0F', position: 'relative' }}>
      <LogoBg />
      <div style={{ position:'relative', zIndex:1, width:'100%', maxWidth:380 }}>
        <div className="flex flex-col items-center mb-8">
          <GestapackLogo height={44}/>
          <p className="text-xs tracking-widest uppercase mt-4" style={{color:'#5a4010'}}>
            Dashboard Comercial
          </p>
        </div>
        <div className="rounded-2xl p-7 space-y-5"
          style={{ background:'#0F0F16', border:'1px solid #1a1a28' }}>
          <div className="text-center space-y-1">
            <h2 className="text-base font-bold text-white">Ingresar al Dashboard</h2>
            <p className="text-xs" style={{color:'#444458'}}>Introduce tu PIN de acceso</p>
          </div>
          <input
            type="password" inputMode="numeric" pattern="[0-9]*" maxLength={6}
            value={pin}
            onChange={e => { setPin(e.target.value.replace(/\D/g,'')); setError(''); }}
            onKeyDown={e => e.key === 'Enter' && submit()}
            placeholder="••••"
            autoFocus
            className="w-full text-center text-2xl rounded-xl py-3 font-bold"
            style={{
              background:'#161622',
              border: error ? '1px solid rgba(239,68,68,0.5)' : '1px solid #21212E',
              color:'#c88d31', outline:'none', letterSpacing:'0.4em',
            }}
            onFocus={e  => { e.target.style.borderColor = '#c88d31'; }}
            onBlur={e   => { e.target.style.borderColor = error ? 'rgba(239,68,68,0.5)' : '#21212E'; }}
          />
          {error && <p className="text-xs text-center" style={{color:'#F87171'}}>{error}</p>}
          <button onClick={submit} disabled={loading || pin.length < 4}
            className="w-full py-3 rounded-xl font-semibold text-sm transition-all"
            style={{
              background: (loading||pin.length<4) ? 'rgba(200,141,49,0.07)' : 'rgba(200,141,49,0.18)',
              color:      (loading||pin.length<4) ? '#4a3008'               : '#c88d31',
              border:     '1px solid rgba(200,141,49,0.3)',
            }}>
            {loading
              ? <span className="flex items-center justify-center gap-2"><Loader2 size={14} className="animate-spin"/>Verificando…</span>
              : 'Ingresar'}
          </button>
        </div>
        <p className="text-center text-xs mt-5" style={{color:'#1e1e2e'}}>
          Gestapack · Dashboard Comercial
        </p>
      </div>
    </div>
  );
};

// Campo PIN reutilizable — debe estar FUERA de cualquier componente
// para que React no lo desmonte/monte en cada re-render
const PinFieldInput = ({ value, onChange, label, onClearError }) => (
  <div className="space-y-1">
    <p className="text-xs font-medium" style={{color:'#9CA3AF'}}>{label}</p>
    <input
      type="password" inputMode="numeric" pattern="[0-9]*" maxLength={6}
      value={value}
      onChange={e => { onChange(e.target.value.replace(/\D/g,'')); onClearError?.(); }}
      className="w-full text-center text-xl rounded-xl py-2.5 font-bold"
      style={{ background:'#161622', border:'1px solid #21212E', color:'#c88d31', outline:'none', letterSpacing:'0.3em' }}
      onFocus={e => e.target.style.borderColor='#c88d31'}
      onBlur={e  => e.target.style.borderColor='#21212E'}
    />
  </div>
);

const SetupScreen = ({ onSetup }) => {
  const [adminPin,  setAdminPin]  = useState('');
  const [adminPin2, setAdminPin2] = useState('');
  const [userPin,   setUserPin]   = useState('');
  const [userPin2,  setUserPin2]  = useState('');
  const [error,     setError]     = useState('');
  const [loading,   setLoading]   = useState(false);

  const submit = async () => {
    if (adminPin.length < 4)       { setError('PIN admin: mínimo 4 dígitos'); return; }
    if (adminPin !== adminPin2)     { setError('Los PINs admin no coinciden'); return; }
    if (userPin.length < 4)        { setError('PIN usuario: mínimo 4 dígitos'); return; }
    if (userPin !== userPin2)      { setError('Los PINs de usuario no coinciden'); return; }
    if (adminPin === userPin)      { setError('Los PINs deben ser distintos'); return; }
    setLoading(true);
    try { onSetup(await GpCrypto.setup(adminPin, userPin)); }
    catch(e) { setError('Error al configurar'); setLoading(false); }
  };

  return (
    <div className="min-h-screen flex flex-col items-center justify-center p-6"
      style={{ background:'#0A0A0F', position:'relative' }}>
      <LogoBg/>
      <div style={{ position:'relative', zIndex:1, width:'100%', maxWidth:440 }}>
        <div className="flex flex-col items-center mb-8">
          <GestapackLogo height={40}/>
          <p className="text-xs tracking-widest uppercase mt-4" style={{color:'#5a4010'}}>
            Primera Configuración
          </p>
        </div>
        <div className="rounded-2xl p-7 space-y-5"
          style={{ background:'#0F0F16', border:'1px solid #1a1a28' }}>
          <div>
            <h2 className="text-base font-bold text-white">Configurar acceso al Dashboard</h2>
            <p className="text-xs mt-1 leading-relaxed" style={{color:'#555570'}}>
              Define dos PINs numéricos (4–6 dígitos). Ninguno se guardará en texto plano.
            </p>
          </div>

          {/* PIN Admin */}
          <div className="space-y-3 rounded-xl p-4"
            style={{background:'rgba(200,141,49,0.04)',border:'1px solid rgba(200,141,49,0.15)'}}>
            <div className="flex items-center gap-2">

const calcP = (rows) => {
  const venta   = rows.reduce((s, r) => s + r.venta,   0);
  const contrib = rows.reduce((s, r) => s + r.contrib, 0);
  return { venta, contrib, margen: venta > 0 ? (contrib / venta) * 100 : 0 };
};

const PCOLS = [
  { k: "week",    l: "Semana"     },
  { k: "month",   l: "Mes Cal."   },
  { k: "roll30",  l: "30 Días"    },
  { k: "quarter", l: "Trim. Cal." },
  { k: "roll90",  l: "90 Días"    },
];


// ── SvgTrend — pure SVG line chart (no recharts) ─────────────────────────────
const SvgTrend = ({ data, height = 90 }) => {
  if (!data || data.length < 2) return null;
  const W = 700, PL = 48, PR = 8, PT = 6, PB = 18;
  const cw = W - PL - PR, ch = height - PT - PB;
  const maxV = data.reduce((m, d) => Math.max(m, d.venta || 0, d.contrib || 0), 0) || 1;
  const xP = (i) => PL + (i / (data.length - 1)) * cw;
  const yP = (v) => PT + ch - (v / maxV) * ch;
  const poly = (key, color) => (
    <polyline points={data.map((d,i) => `${xP(i)},${yP(d[key]||0)}`).join(" ")}
      fill="none" stroke={color} strokeWidth="2" strokeLinejoin="round" strokeLinecap="round"/>
  );
  const yTks = [0, 0.5, 1].map(f => {
    const v = maxV * f;
    return { y: yP(v), l: v >= 1e6 ? (v/1e6).toFixed(1)+"M" : v >= 1e3 ? Math.round(v/1e3)+"K" : v.toFixed(0) };
  });
  const xIdxs = data.length <= 4 ? data.map((_,i) => i) : [0, Math.floor((data.length-1)/2), data.length-1];
  return (
    <svg viewBox={`0 0 ${W} ${height}`} width="100%" height={height} style={{overflow:"visible"}}>
      {yTks.map(t => <line key={t.l} x1={PL} x2={W-PR} y1={t.y} y2={t.y} stroke="#374151" strokeWidth="0.5"/>)}
      {yTks.map(t => <text key={"y"+t.l} x={PL-4} y={t.y+3} textAnchor="end" fontSize="9" fill="#6B7280">{t.l}</text>)}
      {xIdxs.map(i => <text key={"x"+i} x={xP(i)} y={height-2} textAnchor="middle" fontSize="9" fill="#6B7280">{data[i].label}</text>)}
      {poly("venta",   "#3B82F6")}
      {poly("contrib", "#10B981")}
      {["venta","contrib"].flatMap((k,ki) => [0,data.length-1].map(i => (
        <circle key={k+i} cx={xP(i)} cy={yP(data[i][k]||0)} r="3"
          fill={ki===0?"#3B82F6":"#10B981"} stroke="#0f172a" strokeWidth="1.5"/>
      )))}
    </svg>
  );
};

const VentasTab = ({ data }) => {
  const [search,      setSearch]      = useState("");
  const [metric,      setMetric]      = useState("venta");
  const [showTop,     setShowTop]     = useState("venta");
  const [panelClient, setPanelClient] = useState(null);

  const mainSort = useSort("totalV", "desc");
  const topSort  = useSort(null,     "desc");

  const rows = useMemo(() =>
    data.map((r) => ({
      cliente:  col(r, "Razón Social", "Razon Social"),
      fecha:    parseDate(col(r, "Fecha")),
      producto: col(r, "Producto"),
      venta:    parseNum(col(r, "Total Línea", "Total Linea", "Total")),
      contrib:  parseNum(col(r, "Margen Contrib $")),
    })).filter((r) => r.fecha && r.cliente),
  [data]);

  const refDate = useMemo(() => {
    if (!rows.length) return new Date();
    let max = -Infinity;
    rows.forEach((r) => { const t = r.fecha.getTime(); if (t > max) max = t; });
    return new Date(max);
  }, [rows]);

  const P = useMemo(() => getPeriods(refDate), [refDate]);

  const clientMap = useMemo(() => {
    const m = {};
    rows.forEach((r) => {
      if (!r.cliente) return;
      if (!m[r.cliente]) m[r.cliente] = { rows: [], skus: new Set() };
      m[r.cliente].rows.push(r);
      if (r.producto) m[r.cliente].skus.add(r.producto);
    });
    return m;
  }, [rows]);

  const globals = useMemo(() => {
    const f   = (a, b) => rows.filter((r) => inR(r.fecha, a, b));
    const r90 = f(P.roll90Start, P.today);
    const curr30 = calcP(f(P.roll30Start, P.today));
    // Previous 30-day window (days 31-60 ago)
    const prev30End   = new Date(refDate.getTime() - 30 * 86400000);
    const prev30Start = new Date(refDate.getTime() - 59 * 86400000);
    const prev30  = calcP(f(s0(prev30Start), e23(prev30End)));
    const delta30V = prev30.venta > 0 ? ((curr30.venta - prev30.venta) / prev30.venta) * 100 : null;
    const delta30M = prev30.venta > 0 ? curr30.margen - prev30.margen : null;
    return {
      week:    calcP(f(P.weekStart,  P.weekEnd)),
      month:   calcP(f(P.monthStart, P.monthEnd)),
      roll30:  curr30,
      quarter: calcP(f(P.qStart,     P.qEnd)),
      roll90:  { ...calcP(r90), skus: new Set(r90.map((r) => r.producto).filter(Boolean)).size },
      delta30V,
      delta30M,
    };
  }, [rows, P, refDate]);

  const summaries = useMemo(() => {
    return Object.entries(clientMap).map(([cliente, c]) => {
      const f = (a, b) => c.rows.filter((r) => inR(r.fecha, a, b));
      const build = (a, b, g) => {
        const p = calcP(f(a, b));
        return { ...p, ppv: g.venta > 0 ? (p.venta / g.venta) * 100 : 0, ppc: g.contrib > 0 ? (p.contrib / g.contrib) * 100 : 0 };
      };
      const totalV = c.rows.reduce((s, r) => s + r.venta,   0);
      const totalC = c.rows.reduce((s, r) => s + r.contrib, 0);
      return {
        cliente, skus: c.skus.size,
        week:    build(P.weekStart,  P.weekEnd,  globals.week),
        month:   build(P.monthStart, P.monthEnd, globals.month),
        roll30:  build(P.roll30Start, P.today,   globals.roll30),
        quarter: build(P.qStart,     P.qEnd,     globals.quarter),
        roll90:  build(P.roll90Start, P.today,   globals.roll90),
        totalV, totalC, rows: c.rows,
      };
    }).sort((a, b) => b.totalV - a.totalV);
  }, [clientMap, P, globals]);

  const top20V = useMemo(() => summaries.slice(0, 20), [summaries]);
  const top20C = useMemo(() => [...summaries].sort((a, b) => b.totalC - a.totalC).slice(0, 20), [summaries]);
  const topBase = showTop === "venta" ? top20V : top20C;

  const sortedTop = useMemo(() => {
    if (!topSort.key) return topBase;
    return applySort(topBase, topSort.key, topSort.dir, (c, k) => {
      if (k === "cliente") return c.cliente.toLowerCase();
      if (k === "total")   return showTop === "venta" ? c.totalV : c.totalC;
      if (k === "margen")  return c.totalV > 0 ? (c.totalC / c.totalV) * 100 : 0;
      if (k === "skus")    return c.skus;
      return 0;
    });
  }, [topBase, topSort.key, topSort.dir, showTop]);

  const filtered = useMemo(() => {
    if (!search.trim()) return summaries;
    const q = search.toLowerCase();
    return summaries.filter((c) => c.cliente.toLowerCase().includes(q));
  }, [summaries, search]);

  const mainAccessor = useCallback((c, sk) => {
    if (sk === "cliente") return c.cliente.toLowerCase();
    if (sk === "skus")    return c.skus;
    for (const { k } of PCOLS) {
      if (sk === k) {
        if (metric === "venta")   return c[k].venta;
        if (metric === "contrib") return c[k].contrib;
        return c[k].margen;
      }
      if (sk === k + "_p") return metric === "venta" ? c[k].ppv : c[k].ppc;
    }
    return 0;
  }, [metric]);

  const sortedFiltered = useMemo(
    () => applySort(filtered, mainSort.key, mainSort.dir, mainAccessor),
    [filtered, mainSort.key, mainSort.dir, mainAccessor]
  );

  const totalVentaGlobal = useMemo(() => summaries.reduce((s,c) => s + c.totalV, 0), [summaries]);

  const panelDetail = useMemo(() => {
    if (!panelClient) return null;
    const skuMap = {}, byWeek = {};
    panelClient.rows.forEach((r) => {
      const k = r.producto || "(sin nombre)";
      if (!skuMap[k]) skuMap[k] = { sku: k, venta: 0, contrib: 0 };
      skuMap[k].venta   += r.venta;
      skuMap[k].contrib += r.contrib;
      const ws = getWeekStart(r.fecha);
      const wk = ws.toISOString().slice(0, 10);
      if (!byWeek[wk]) byWeek[wk] = { label: fmtDate(ws), venta: 0, contrib: 0 };
      byWeek[wk].venta   += r.venta;
      byWeek[wk].contrib += r.contrib;
    });
    const skuBreakdown = Object.values(skuMap)
      .map((s) => ({ ...s, margen: s.venta > 0 ? (s.contrib / s.venta) * 100 : 0 }))
      .sort((a, b) => b.venta - a.venta);
    const trend = Object.entries(byWeek)
      .sort(([a], [b]) => a.localeCompare(b))
      .map(([, v]) => v)
      .slice(-16);
    return { ...panelClient, skuBreakdown, trend };
  }, [panelClient]);

  const { page, go, totalPages, slice, total } = usePag(sortedFiltered);
  const getCellVal = (c, pk) => {
    const p = c[pk];
    if (metric === "venta")   return "$" + fmtM(p.venta);
    if (metric === "contrib") return "$" + fmtM(p.contrib);
    return fmtPct(p.margen);
  };
  const STHtop  = (props) => <SortTh {...props} currentKey={topSort.key}  dir={topSort.dir}  onSort={topSort.toggle}  />;
  const STHmain = (props) => <SortTh {...props} currentKey={mainSort.key} dir={mainSort.dir} onSort={mainSort.toggle} />;

  const handleExportVentas = useCallback(() => {
    const wsData = sortedFiltered.map(c => ({
      'Cliente': c.cliente,
      'SKUs': c.skus,
      'Venta Trim. Cal.': c.quarter.venta,
      'Contrib. Trim. Cal.': c.quarter.contrib,
      'Margen % Trim.': +(c.quarter.venta > 0 ? (c.quarter.contrib/c.quarter.venta*100) : 0).toFixed(1),
      'Venta 30 Días': c.roll30.venta,
      'Contrib. 30 Días': c.roll30.contrib,
      'Venta Total': c.totalV,
      'Contrib. Total': c.totalC,
      'Margen % Total': +(c.totalV > 0 ? (c.totalC/c.totalV*100) : 0).toFixed(1),
    }));
    const wb = XLSX.utils.book_new();
    const ws = XLSX.utils.json_to_sheet(wsData);
    XLSX.utils.book_append_sheet(wb, ws, 'Ventas por Cliente');
    XLSX.writeFile(wb, `ventas_clientes_${fmtDate(refDate)}.xlsx`);
  }, [sortedFiltered, refDate]);

  return (
    <div className="space-y-5">
      {/* Sliding detail panel */}
      {panelDetail && (
        <DetailPanel
          title={panelDetail.cliente}
          subtitle={`${panelDetail.skus} SKUs · ${panelDetail.rows.length.toLocaleString("es-CL")} líneas`}
          onClose={() => setPanelClient(null)}>
          <div className="space-y-4">
            <div className="grid grid-cols-3 gap-3">
              <Card label="Venta Total"        value={"$" + fmtM(panelDetail.totalV)} color="text-blue-300"/>
              <Card label="Contribución Total"  value={"$" + fmtM(panelDetail.totalC)} color="text-emerald-300"/>
              <Card label="Margen % Total"
                value={fmtPct(panelDetail.totalV > 0 ? (panelDetail.totalC / panelDetail.totalV) * 100 : 0)}
                sub={panelDetail.skus + " SKUs"} color="text-yellow-300"/>
            </div>
            {panelDetail.trend.length > 1 && (
              <div style={{background:"#111827",border:"1px solid #374151",borderRadius:12,padding:12}}>
                <p style={{fontSize:11,color:"#6B7280",marginBottom:8,textTransform:"uppercase",letterSpacing:"0.05em"}}>Tendencia semanal</p>
                <SvgTrend data={panelDetail.trend} height={90}/>
                <div style={{display:"flex",gap:16,marginTop:4,fontSize:11,color:"#6B7280"}}>
                  <span><span style={{display:"inline-block",width:12,height:2,background:"#3B82F6",verticalAlign:"middle",marginRight:4}}/>Venta</span>
                  <span><span style={{display:"inline-block",width:12,height:2,background:"#10B981",verticalAlign:"middle",marginRight:4}}/>Contribución</span>
                </div>
              </div>
            )}
            <div style={{background:"#111827",border:"1px solid #374151",borderRadius:12,overflow:"hidden"}}>
              <div style={{padding:"10px 16px",borderBottom:"1px solid #374151",fontSize:11,fontWeight:600,color:"#6B7280",textTransform:"uppercase",letterSpacing:"0.05em"}}>
                Apertura por SKU — {panelDetail.skuBreakdown.length} productos
              </div>
              <div style={{overflowX:"auto"}}>
                <table style={{width:"100%",borderCollapse:"collapse"}}>
                  <thead style={{background:"#1f2937",position:"sticky",top:0}}>
                    <tr><Th ch="Producto / SKU"/><Th ch="Venta Neta" right/><Th ch="Contribución" right/><Th ch="Margen %" right/></tr>
                  </thead>
                  <tbody>
                    {panelDetail.skuBreakdown.map((s, i) => (
                      <tr key={i} style={{borderBottom:"1px solid rgba(31,41,55,0.6)"}}>
                        <td style={{padding:"8px 12px",fontSize:13,color:"#E5E7EB",maxWidth:260}}>
                          <span style={{display:"block",overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}} title={s.sku}>{s.sku}</span>
                        </td>
                        <Td ch={"$" + fmtM(s.venta)}  right/>
                        <Td ch={"$" + fmtM(s.contrib)} right color="text-emerald-400"/>
                        <Td ch={fmtPct(s.margen)} right color={s.margen > 15 ? "text-emerald-300" : s.margen > 0 ? "text-yellow-300" : "text-red-400"}/>
                      </tr>
                    ))}
                  </tbody>
                </table>
              </div>
            </div>
          </div>
        </DetailPanel>
      )}

      {/* KPIs */}
      <div className="grid grid-cols-2 lg:grid-cols-3 xl:grid-cols-6 gap-3">
        <Card label="Venta Trim. Cal."    value={"$" + fmtM(globals.quarter.venta)}   sub={rows.length.toLocaleString("es-CL") + " líneas"} color="text-blue-300" delta={globals.delta30V} />
        <Card label="Contrib. Trim. Cal." value={"$" + fmtM(globals.quarter.contrib)} sub={"Margen: " + fmtPct(globals.quarter.margen)} color="text-emerald-300" />
        <Card label="Margen % 90 días"    value={fmtPct(globals.roll90.margen)}        sub={"Contrib: $" + fmtM(globals.roll90.contrib)} color="text-yellow-300" />
        <Card label="SKUs únicos 90 días" value={globals.roll90.skus}                  sub="Productos distintos" color="text-pink-300" />

        <div className="px-4 py-2.5 border-b border-gray-700 text-xs text-gray-500">
          {filtered.length} cliente{filtered.length !== 1 ? "s" : ""} — haz clic en cualquier fila para ver el detalle
        </div>
        <div className="overflow-x-auto">
          <table className="w-full">
            <thead className="bg-gray-800/60">
              <tr>
                <STHmain label="Cliente" sk="cliente"/>
                <STHmain label="SKUs"    sk="skus"   right/>
                {PCOLS.map((pc) => <STHmain key={pc.k} label={pc.l} sk={pc.k} right/>)}
                {metric !== "margen" && PCOLS.map((pc) => <STHmain key={pc.k+"_p"} label={"Part% "+pc.l.split(".")[0]} sk={pc.k+"_p"} right/>)}

        <Pager page={page} totalPages={totalPages} go={go} total={total}/>

  );

  const rows = useMemo(() =>
    data.map((r) => ({

      producto: col(r, "Producto"),
      lote:     col(r, "Lote"),
      precioUn: parseNum(col(r, "Precio Un.")),
      cantidad: parseNum(col(r, "Cantidad")),
    })).filter((r) => r.cliente),
  [data]);

  const clientSummary = useMemo(() => {
    const map = {};

      const k = r.cliente;
      if (!map[k]) map[k] = { cliente: k, rows: [], prods: new Set(), totalQ: 0, lastFecha: null };
      map[k].rows.push(r);
      if (r.producto) map[k].prods.add(r.producto);
      map[k].totalQ += r.cantidad;
      if (!map[k].lastFecha || (r.fecha && r.fecha > map[k].lastFecha)) map[k].lastFecha = r.fecha;

  const sortedClients = useMemo(() =>
    applySort(filteredClients, guiSort.key, guiSort.dir, (c, k) => {

    <div className="space-y-4">
      {/* Panel */}
      {panelClient && (
        <DetailPanel
          title={panelClient.cliente}
          subtitle={`${panelClient.prods} productos · ${panelClient.rows.length} líneas`}
          onClose={() => setPanelClient(null)}>
          <div className="space-y-4">
            <div className="grid grid-cols-3 gap-3">
              <Card label="Líneas Totales"      value={panelClient.rows.length}    color="text-white"/>
              <Card label="Productos Distintos" value={panelClient.prods}           color="text-blue-300"/>

            </div>

              <button type="button" onClick={handleExport}

                <Download size={13}/> Exportar Excel
              </button>
            </div>
            <div style={{background:"#111827",border:"1px solid #374151",borderRadius:12,overflow:"hidden"}}>
              <div style={{overflowX:"auto"}}>
                <table style={{width:"100%",borderCollapse:"collapse"}}>
                  <thead style={{background:"#1f2937",position:"sticky",top:0}}>
                    <tr>
                      <Th ch="Fecha"/><Th ch="Producto"/><Th ch="Marca/Lote"/>

                  <tbody>
                    {panelRows.map((r, i) => (

                        <td style={{padding:"8px 12px",fontSize:13,color:"#E5E7EB",maxWidth:220}}>
                          <span style={{display:"block",overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{r.producto}</span>

        <div className="overflow-x-auto">

const SvgSparkline = ({ history }) => {
  if (!history || history.length < 2) return null;
  const W = 120, H = 36, PAD = 4;
  const prices = history.map(h => h.p);
  const minP = prices.reduce((m, v) => Math.min(m, v), Infinity);
  const maxP = prices.reduce((m, v) => Math.max(m, v), -Infinity);
  const range = maxP - minP || 1;
  const xP = (i) => PAD + (i / (history.length - 1)) * (W - PAD * 2);
  const yP = (v) => H - PAD - ((v - minP) / range) * (H - PAD * 2);
  const lastColor = history[history.length-1].p >= history[0].p ? "#EF4444" : "#10B981";
  const pts = history.map((h, i) => `${xP(i)},${yP(h.p)}`).join(" ");
  return (
    <svg viewBox={`0 0 ${W} ${H}`} width={W} height={H}>
      <polyline points={pts} fill="none" stroke={lastColor} strokeWidth="1.5" strokeLinejoin="round" strokeLinecap="round"/>
      <circle cx={xP(history.length-1)} cy={yP(history[history.length-1].p)} r="2.5" fill={lastColor}/>
    </svg>
  );
};

    // Build ventas map: normStr(producto) → {venta, contrib}
    const ventasMap = {};
    ventasData.forEach(r => {
      const prod = normStr(col(r, "Producto"));
      if (!prod) return;
      if (!ventasMap[prod]) ventasMap[prod] = { venta: 0, contrib: 0 };
      ventasMap[prod].venta   += parseNum(col(r, "Total Línea", "Total Linea", "Total"));
      ventasMap[prod].contrib += parseNum(col(r, "Margen Contrib $"));
    });

    // Build compras map: proveedor → Set of normalized products
    // comprasRows ya está procesado: usa r.proveedor y r.producto (no col())
    const provMap = {};
    comprasRows.forEach(r => {
      const prov = r.proveedor;
      const prod = normStr(r.producto || '');
      if (!prov || !prod) return;
      if (!provMap[prov]) provMap[prov] = new Set();
      provMap[prov].add(prod);
    });

    // For each proveedor, sum ventas data of their products
    return Object.entries(provMap).map(([prov, prods]) => {
      let ventaTotal = 0, contribTotal = 0, matched = 0;
      prods.forEach(prod => {
        // 1) Exact normalized match
        let v = ventasMap[prod];
        if (!v) {
          // 2) Ventas product is contained in compras product (ej: "filete" ⊂ "filete vacuno vacio")
          // 3) First 2 significant words match (ej: "lomo liso" == "lomo liso nac")
          const prodWords2 = prod.split(' ').filter(w => w.length > 2).slice(0, 2).join(' ');
          const key = Object.keys(ventasMap).find(k => {
            if (!k) return false;
            if (prod.startsWith(k) || k.startsWith(prod)) return true;
            const kWords2 = k.split(' ').filter(w => w.length > 2).slice(0, 2).join(' ');
            return kWords2 && prodWords2 && kWords2 === prodWords2;
          });
          if (key) v = ventasMap[key];
        }
        if (v) { ventaTotal += v.venta; contribTotal += v.contrib; matched++; }
      });
      const margen = ventaTotal > 0 ? (contribTotal / ventaTotal) * 100 : 0;
      return { prov, ventaTotal, contribTotal, margen, matched, total: prods.size };
    }).filter(r => r.ventaTotal > 0).sort((a, b) => b.ventaTotal - a.ventaTotal);
  }, [comprasRows, ventasData]);

  if (!data.length) return (
    <div className="px-4 py-8 text-center text-sm" style={{color:"#444458"}}>
      No se encontraron productos coincidentes entre compras y ventas
    </div>
  );

  return (
    <div className="overflow-x-auto">
      <table className="w-full">
        <thead className="bg-gray-800/60">
          <tr>
            <Th ch="Proveedor"/>
            <Th ch="Venta de sus productos" right/>
            <Th ch="Contribución generada" right/>
            <Th ch="Margen %" right/>
            <Th ch="Productos cruzados" right/>
          </tr>
        </thead>
        <tbody className="divide-y divide-gray-800/60">
          {data.map((r, i) => (
            <tr key={r.prov} className="hover:bg-emerald-900/10 transition-colors">
              <td className="px-3 py-2.5 text-sm font-medium text-white max-w-[220px]">
                <span className="block truncate">{r.prov}</span>
              </td>
              <Td ch={"$" + fmtM(r.ventaTotal)} right bold/>
              <Td ch={"$" + fmtM(r.contribTotal)} right color="text-emerald-400"/>
              <Td ch={fmtPct(r.margen)} right
                color={r.margen > 15 ? "text-emerald-300" : r.margen > 0 ? "text-yellow-300" : "text-red-400"}/>
              <td className="px-3 py-2.5 text-sm text-right">
                <span style={{color:"#555570"}}>{r.matched}</span>
                <span style={{color:"#333345"}}> / {r.total} SKUs</span>
              </td>
            </tr>
          ))}
        </tbody>
      </table>
    </div>
  );
};

//  TAB 4 — OPTIMIZADOR DE PRECIOS
// ═══════════════════════════════════════════════

const PRICE_KW = ["precio", "price", "valor", "costo", "tarifa", "p.u.", "pu", "unit", "importe", "neto", "monto", "total"];
const PROD_KW  = ["producto", "descripcion", "descripción", "articulo", "artículo", "corte", "nombre", "item", "detalle", "concepto"];
const ATTR_KW  = ["marca", "procedencia", "origen", "planta", "pais", "país", "raza", "tipo", "calidad"];
const CATEGORY_KW = new Set([
  "vacuno","bovino","ternera","res",
  "cerdo","porcino","chancho",
  "pollo","ave","aves",
  "congelado","congelados","fresco","frescos",
  "ovino","cordero","caprina","cabra",
  "salmon","salmón","pescado","mariscos","seafood",
  "embutido","embutidos","fiambre","fiambres","charcuteria",
]);
const isCategoryHeader = (prodVal, priceVal) => {
  if (priceVal !== "" && priceVal != null && parseNum(String(priceVal)) > 0) return false;
  const s = String(prodVal == null ? "" : prodVal).trim();
  if (!s || s.length > 60) return false;
  if (/[▸►▶→▷◆●■]/.test(s)) return true;
  const words = normStr(s).split(" ").filter(Boolean);
  // All non-trivial words are category keywords (handles "VACUNO", "CERDO FRESCO", etc.)
  if (words.length === 0) return false;
  const meaningful = words.filter(w => w.length > 2);
  return meaningful.length > 0 && meaningful.every(w => CATEGORY_KW.has(w));
};

const GROUP_STRIP = new Set([
  "medallon","medallón","medallones",
  "entero","entera","enteros","enteras",
  "porcionado","porcionada","porcionados","porcionadas",
  "trozado","trozada","trozados",
]);

const normStr = (s) =>
  String(s).toLowerCase()
    .normalize("NFD").replace(/[\u0300-\u036f]/g, "")
    .replace(/[^a-z0-9\s]/g, " ")
    .replace(/\s+/g, " ").trim();

const makeGroupKey = (normProd) =>
  normProd.split(" ").filter(w => w && !GROUP_STRIP.has(w)).join(" ").trim() || normProd;

const detectProvCat = (filename, sheetName = "") => {
  const base = filename.replace(/\.(xlsx?|csv)$/i, "");
  const dashIdx = base.indexOf("-");
  if (dashIdx > 0) {
    return { provider: base.slice(0, dashIdx).trim(), category: base.slice(dashIdx + 1).trim() };
  }
  const ignored = ["sheet1", "hoja1", "sheet", "hoja", "data", "datos", "precios", "lista"];
  const catFromSheet = sheetName && !ignored.includes(sheetName.toLowerCase().trim())
    ? sheetName.trim() : "Vacuno";
  return { provider: base.trim(), category: catFromSheet };
};

const parseSheetGrid = (grid, provider, category, fileId) => {
  if (!grid || grid.length < 2) return [];
  // Find real header row (≥2 string columns)
  let hRow = -1;
  for (let i = 0; i < Math.min(15, grid.length); i++) {
    const row = grid[i];
    const strCells = row.filter(
      (c) => c !== "" && c != null && typeof c === "string" && c.trim().length > 1 && isNaN(Number(String(c).replace(",",".")))
    );
    if (strCells.length >= 2) { hRow = i; break; }
  }
  if (hRow === -1) return [];
  const headers = grid[hRow].map((h) => String(h == null ? "" : h).trim());
  const hNorm   = headers.map((h) => normStr(h));
  let prodCol  = hNorm.findIndex((h) => PROD_KW.some((kw) => h.includes(kw)));
  if (prodCol  === -1) prodCol  = headers.findIndex((h) => h !== "");
  let priceCol = hNorm.findIndex((h) => PRICE_KW.some((kw) => h.includes(kw)));
  if (priceCol === -1) {
    for (let c = 0; c < headers.length; c++) {
      if (c === prodCol) continue;
      const sample = grid.slice(hRow + 1, hRow + 9).map((r) => r[c]).filter((v) => v !== "" && v != null);
      const isPriceLike = (v) => {
        const clean = String(v).replace(/[$\s]/g, "");
        if (/[a-zA-Z]/.test(clean)) return false;
        return parseNum(String(v)) > 0;
      };
      if (sample.length >= 2 && sample.every(isPriceLike)) { priceCol = c; break; }
    }
  }
  const attrCols = hNorm.reduce((acc, h, i) => {
    if (ATTR_KW.some((kw) => h.includes(kw))) acc.push({ idx: i });
    return acc;
  }, []);
  if (prodCol === -1 || priceCol === -1) return [];
  const rows = [];
  let currentCategory = category; // starts with file/sheet name; overridden by in-file headers
  for (let i = hRow + 1; i < grid.length; i++) {
    const row     = grid[i];
    const rawProd = String(row[prodCol] == null ? "" : row[prodCol]).trim();
    const rawPrc  = priceCol !== -1 ? row[priceCol] : "";
    // ── Detect in-file category header row ──────────────────────────
    if (rawProd && isCategoryHeader(rawProd, rawPrc)) {
      // Clean the category label (remove special chars, trim)
      currentCategory = rawProd.replace(/[▸►▶→▷◆●■]/g, "").trim();
      continue; // skip — do not add as a product row
    }
    if (!rawProd || rawPrc === "" || rawPrc == null) continue;
    const precio = parseNum(String(rawPrc));
    if (precio <= 0) continue;
    const atributo = attrCols
      .map((a) => String(row[a.idx] == null ? "" : row[a.idx]).trim())
      .filter(Boolean).join(" · ");
    const productoNorm = normStr(rawProd);
    rows.push({
      uid:              `${fileId}_${i}`,
      fileId,
      proveedor:        provider,
      categoria:        currentCategory, // ← in-file category takes priority
      productoOriginal: rawProd,
      productoNorm,
      groupKey:         makeGroupKey(productoNorm),
      atributo,
      precio,
    });
  }
  return rows;
};

  const uploadRef  = useRef();
  const priceSort  = useSort("precio", "asc");
  const lastVersion = useRef(-1);

  // Procesa nuevos archivos cuando llega una versión nueva desde App
  useEffect(() => {
    if (
      pendingFiles &&
      pendingFiles.version > lastVersion.current &&
      pendingFiles.files && pendingFiles.files.length > 0
    ) {
      lastVersion.current = pendingFiles.version;
      handlePriceFiles(pendingFiles.files);
    }
  }, [pendingFiles && pendingFiles.version]);  // eslint-disable-line

  const handlePriceFiles = useCallback(async (fileList) => {
    setLoading(true);
    const newRows  = [];
    const newCards = [];
    for (const file of Array.from(fileList)) {
      const ext    = file.name.split(".").pop().toLowerCase();
      const fileId = `${file.name}_${Date.now()}_${Math.random().toString(36).slice(2)}`;
      try {
        if (ext === "csv") {
          const text  = await file.text();
          const lines = text.split(/\r?\n/).filter(Boolean);
          if (!lines.length) continue;
          const h1    = lines[0].replace(/^\uFEFF/, "");
          const delim = (h1.match(/;/g) || []).length >= (h1.match(/,/g) || []).length ? ";" : ",";
          const grid  = lines.map((l) =>
            l.replace(/^\uFEFF/, "").split(delim).map((c) => c.trim().replace(/^"|"$/g, ""))
          );
          const { provider, category } = detectProvCat(file.name);
          const rows = parseSheetGrid(grid, provider, category, fileId);
          newRows.push(...rows);
          newCards.push({ id: fileId, name: file.name, provider, category, count: rows.length });
        } else if (ext === "xlsx" || ext === "xls") {
          const buf = await file.arrayBuffer();
          const wb  = XLSX.read(buf, { type: "array" });
          for (const sheetName of wb.SheetNames) {
            const ws          = wb.Sheets[sheetName];
            const grid        = XLSX.utils.sheet_to_json(ws, { header: 1, defval: "" });
            const sheetFileId = `${fileId}_${sheetName}`;
            const { provider, category } = detectProvCat(file.name, sheetName);
            const rows = parseSheetGrid(grid, provider, category, sheetFileId);
            if (rows.length > 0) {
              newRows.push(...rows);
              newCards.push({ id: sheetFileId, name: `${file.name} [${sheetName}]`, provider, category, count: rows.length });
            }
          }
        }
      } catch (err) {
        console.error("Error al procesar", file.name, err);
      }
    }
    setAllRows((prev) => [...prev, ...newRows]);
    setFileCards((prev) => [...prev, ...newCards]);
    setLoading(false);
  }, []);

  const deleteFile = useCallback((fileId) => {
    setAllRows((prev) => prev.filter((r) => r.fileId !== fileId));
    setFileCards((prev) => prev.filter((f) => f.id !== fileId));
  }, []);

  const clearAll = () => { setAllRows([]); setFileCards([]); setSearch(""); setCatFilter("Todos"); };

  const categories = useMemo(() => {
    const cats = [...new Set(allRows.map((r) => r.categoria))].sort();
    return ["Todos", ...cats];
  }, [allRows]);

  const filtered = useMemo(() => {
    let rows = allRows;
    if (catFilter !== "Todos")
      rows = rows.filter((r) => r.categoria.toLowerCase() === catFilter.toLowerCase());
    if (search.trim()) {
      const q = normStr(search);
      rows = rows.filter((r) => r.productoNorm.includes(q) || r.groupKey.includes(q));
    }
    return rows;
  }, [allRows, catFilter, search]);

  const sortedRows = useMemo(() =>
    applySort(filtered, priceSort.key, priceSort.dir, (r, k) => {
      if (k === "proveedor") return r.proveedor.toLowerCase();
      if (k === "categoria") return r.categoria.toLowerCase();
      if (k === "producto")  return r.productoNorm;
      if (k === "atributo")  return r.atributo.toLowerCase();
      if (k === "precio")    return r.precio;
      return 0;
    }),
  [filtered, priceSort.key, priceSort.dir]);

  const bestByGroup = useMemo(() => {
    const map = {};
    filtered.forEach((r) => {
      if (!map[r.groupKey] || r.precio < map[r.groupKey]) map[r.groupKey] = r.precio;
    });
    return map;
  }, [filtered]);

  const avgByGroup = useMemo(() => {
    const sums = {}, counts = {};
    filtered.forEach((r) => {
      if (!sums[r.groupKey]) { sums[r.groupKey] = 0; counts[r.groupKey] = 0; }
      sums[r.groupKey]  += r.precio;
      counts[r.groupKey]++;
    });
    const avgs = {};
    Object.keys(sums).forEach(k => avgs[k] = counts[k] > 1 ? sums[k] / counts[k] : null);
    return avgs;
  }, [filtered]);

  const { page, go, totalPages, slice, total } = usePag(sortedRows);
  const STH = (props) => <SortTh {...props} currentKey={priceSort.key} dir={priceSort.dir} onSort={priceSort.toggle} />;
  const proveedoresCount = new Set(filtered.map((r) => r.proveedor)).size;
  const gruposCount      = new Set(filtered.map((r) => r.groupKey)).size;

  return (
    <div className="space-y-5">

      {/* ── UPLOAD ZONE ─────────────────────────── */}
      <div
        onDrop={(e) => { e.preventDefault(); setDragging(false); handlePriceFiles(e.dataTransfer.files); }}
        onDragOver={(e) => { e.preventDefault(); setDragging(true); }}
        onDragLeave={() => setDragging(false)}
        onClick={() => uploadRef.current?.click()}
        className={`border-2 border-dashed rounded-xl p-4 cursor-pointer transition-all select-none ${
          dragging ? "border-blue-400 bg-blue-950/20" : "border-gray-700 hover:border-gray-600 bg-gray-900/30 hover:bg-gray-900"
        }`}
      >
        {loading
          ? <div className="flex items-center justify-center gap-2 text-blue-400">
              <Loader2 className="animate-spin" size={16} />
              <span className="text-sm">Procesando listas de precios…</span>
            </div>
          : <div className="flex flex-col sm:flex-row items-center justify-center gap-3 text-gray-400 text-sm">
              <div className="flex items-center gap-2"><Upload size={15} /><span>Agregar más listas de precios (.csv o .xlsx)</span></div>
              <span className="hidden sm:block text-gray-700">·</span>
              <span className="text-xs text-gray-600 font-mono bg-gray-800 px-2 py-0.5 rounded">
                Nombre: <span className="text-blue-400">Proveedor-Categoría.xlsx</span>
              </span>
            </div>}
        <input ref={uploadRef} type="file" multiple accept=".csv,.xlsx,.xls" className="hidden"
          onChange={(e) => handlePriceFiles(e.target.files)} />
      </div>

      {/* ── LISTA DE ARCHIVOS CON BOTÓN ELIMINAR ─── */}
      {fileCards.length > 0 && (
        <div className="bg-gray-900 border border-gray-700 rounded-xl overflow-hidden">
          <div className="flex items-center justify-between px-4 py-2.5 border-b border-gray-700">
            <span className="text-xs font-semibold text-gray-400 uppercase tracking-wide">
              Archivos cargados ({fileCards.length})
            </span>
            <button onClick={clearAll}
              className="flex items-center gap-1.5 px-2.5 py-1 bg-red-950/30 border border-red-800/40 text-red-400 hover:text-red-300 rounded-lg text-xs transition-colors">
              <Trash2 size={11} /> Limpiar todo
            </button>
          </div>
          <div className="divide-y divide-gray-800/60 max-h-52 overflow-y-auto">
            {fileCards.map((f) => (
              <div key={f.id} className="flex items-center justify-between px-4 py-2.5 hover:bg-gray-800/20 transition-colors">
                <div className="flex items-center gap-2.5 min-w-0">
                  <FileText size={13} className="text-gray-500 shrink-0" />
                  <div className="min-w-0">
                    <p className="text-sm text-gray-200 truncate">{f.name}</p>
                    <p className="text-xs text-gray-500 mt-0.5">
                      <span className="text-blue-400">{f.provider}</span>
                      <span className="mx-1.5 text-gray-700">·</span>
                      <span className="text-emerald-400">{f.category}</span>
                      <span className="mx-1.5 text-gray-700">·</span>
                      <span>{f.count} precios</span>
                    </p>
                  </div>
                </div>
                <button onClick={() => deleteFile(f.id)}
                  title="Eliminar este archivo"
                  className="shrink-0 ml-3 p-1.5 text-gray-600 hover:text-red-400 hover:bg-red-950/30 rounded-lg transition-all">
                  <X size={14} />
                </button>
              </div>
            ))}
          </div>
        </div>
      )}

      {/* ── SEARCH + CATEGORY FILTER ──────────────── */}
      {allRows.length > 0 && (
        <div className="flex gap-3 flex-wrap items-center">
          <SearchBar
            value={search}
            onChange={(v) => { setSearch(v); go(0); }}
            placeholder="Buscar producto para comparar precios entre proveedores…"
          />
          <div className="flex gap-1 flex-wrap shrink-0">
            {categories.map((c) => (
              <button key={c} onClick={() => { setCatFilter(c); go(0); }}
                className="px-3 py-1.5 rounded-lg text-xs font-semibold transition-all"
                style={catFilter === c
                  ? {background:"rgba(16,185,129,0.18)",color:"#34D399",border:"1px solid rgba(16,185,129,0.35)"}
                  : {background:"#0F0F16",color:"#555570",border:"1px solid #1a1a28"}}
                onMouseEnter={e=>{ if(catFilter!==c) e.currentTarget.style.color="#9CA3AF"; }}
                onMouseLeave={e=>{ if(catFilter!==c) e.currentTarget.style.color="#555570"; }}
              >{c}</button>
            ))}
          </div>
        </div>
      )}

      {/* ── STATS BAR ─────────────────────────────── */}
      {filtered.length > 0 && (
        <div className="flex items-center gap-6 text-xs text-gray-500 px-1 flex-wrap">
          <span><span className="text-white font-semibold">{total.toLocaleString("es-CL")}</span> precios</span>
          <span><span className="text-white font-semibold">{proveedoresCount}</span> proveedores</span>
          <span><span className="text-white font-semibold">{gruposCount}</span> grupos únicos</span>
          {search && (
            <span className="text-emerald-400">
              · {Object.keys(bestByGroup).length} grupos con mejor precio identificado
            </span>
          )}
        </div>
      )}

      {/* ── RESULTS TABLE ────────────────────────── */}
      {sortedRows.length > 0 && (
        <div className="bg-gray-900 border border-gray-700 rounded-xl overflow-hidden">
          <div className="overflow-x-auto">
            <table className="w-full">
              <thead className="bg-gray-800/60">
                <tr>
                  <Th ch="Estado" />
                  <STH label="Categoría"            sk="categoria" />
                  <STH label="Proveedor"             sk="proveedor" />
                  <STH label="Producto Original"     sk="producto"  />
                  <STH label="Marca / Procedencia"   sk="atributo"  />
                  <STH label="Precio Unit."           sk="precio"   right />
                </tr>
              </thead>
              <tbody className="divide-y divide-gray-800/60">
                {slice.map((r) => {
                  const isBest = bestByGroup[r.groupKey] === r.precio;
                  const avg    = avgByGroup[r.groupKey];
                  const saving = isBest && avg && avg > r.precio
                    ? Math.round((1 - r.precio / avg) * 100) : 0;
                  return (
                    <tr key={r.uid}
                      className={`transition-colors ${
                        isBest ? "bg-emerald-950/25 hover:bg-emerald-950/35" : "hover:bg-gray-800/20"
                      }`}>
                      <td className="px-3 py-2.5 text-center whitespace-nowrap">
                        {isBest
                          ? <span className="inline-flex items-center gap-1.5 flex-wrap justify-center">
                              <span className="inline-flex items-center gap-1 px-2 py-0.5 bg-emerald-500/20 border border-emerald-500/40 text-emerald-300 text-xs rounded-full font-semibold">
                                <CheckCircle size={10} /> Mejor
                              </span>
                              {saving > 0 && (
                                <span className="inline-flex items-center px-1.5 py-0.5 text-xs rounded-full font-bold tabular-nums"
                                  style={{background:"rgba(16,185,129,0.12)",color:"#34d399",border:"1px solid rgba(16,185,129,0.25)"}}>
                                  -{saving}% vs prom.
                                </span>
                              )}
                            </span>
                          : <span className="text-gray-700 text-xs">—</span>}
                      </td>
                      <td className="px-3 py-2 text-xs">
                        <span className="px-2 py-0.5 bg-gray-800 border border-gray-700 rounded text-gray-400">
                          {r.categoria}
                        </span>
                      </td>
                      <td className="px-3 py-2 text-sm font-medium text-white max-w-[140px]">
                        <span className="block truncate">{r.proveedor}</span>
                      </td>
                      <td className="px-3 py-2 text-sm text-gray-200 max-w-[220px]">
                        <span className="block truncate" title={r.productoOriginal}>{r.productoOriginal}</span>
                      </td>
                      <td className="px-3 py-2 text-xs text-gray-400 max-w-[160px]">
                        <span className="block truncate" title={r.atributo}>
                          {r.atributo || <span className="text-gray-700 italic">—</span>}
                        </span>
                      </td>
                      <td className={`px-3 py-2.5 text-sm text-right font-bold whitespace-nowrap ${
                        isBest ? "text-emerald-300" : "text-gray-200"
                      }`}>
                        ${fmtM(r.precio)}
                      </td>
                    </tr>
                  );
                })}
              </tbody>
            </table>
          </div>
          <Pager page={page} totalPages={totalPages} go={go} total={total} />
        </div>
      )}

      {/* ── EMPTY STATE ──────────────────────────── */}
      {allRows.length === 0 && !loading && (
        <div className="flex flex-col items-center justify-center py-20 gap-4 text-gray-600">
          <DollarSign size={48} className="opacity-15" />
          <div className="text-center">
            <p className="text-sm font-medium text-gray-500">Carga listas de precios para comenzar</p>
            <p className="text-xs mt-1 text-gray-600">Acepta .xlsx y .csv · Detecta Proveedor y Categoría automáticamente</p>
          </div>
          <div className="bg-gray-900 border border-gray-800 rounded-xl p-4 text-xs text-gray-500 space-y-1.5 max-w-sm">
            <p className="font-semibold text-gray-400 mb-2">Reglas de detección:</p>
            <p><span className="text-blue-400">Proveedor-Categoría.xlsx</span> → extrae ambos del nombre</p>
            <p><span className="text-blue-400">Proveedor.xlsx</span> + nombre de hoja → usa hoja como categoría</p>
            <p>Sin guión ni hoja → Categoría por defecto: <span className="text-emerald-400">Vacuno</span></p>
            <p>Columnas <span className="text-yellow-400">Marca / Procedencia / Origen / Planta</span> → atributo</p>
            <p className="mt-2 pt-2 border-t border-gray-800 text-gray-600">
              Agrupación inteligente: «medallón», «entero» y «porcionado» se ignoran al comparar variantes del mismo corte
            </p>
          </div>
        </div>
      )}

      {allRows.length > 0 && filtered.length === 0 && (
        <div className="flex flex-col items-center justify-center py-16 text-gray-600 gap-3">
          <Search size={36} className="opacity-20" />
          <p className="text-sm">
            Sin resultados para <span className="text-gray-400">"{search}"</span>
            {catFilter !== "Todos" && <> en categoría <span className="text-gray-400">{catFilter}</span></>}
          </p>
        </div>
      )}
    </div>
  );
};

// ═══════════════════════════════════════════════
//  TAB 5 — ANÁLISIS DE PRODUCTOS
// ═══════════════════════════════════════════════
class ProductosErrorBoundary extends React.Component {
  constructor(props) { super(props); this.state = { error: null }; }
  static getDerivedStateFromError(e) { return { error: e }; }
  componentDidCatch(e, info) { console.error("ProductosTab error:", e, info); }
  render() {
    if (this.state.error) {
      return (
        <div className="flex flex-col items-center justify-center py-20 gap-4" style={{color:"#f87171"}}>
          <BarChart2 size={40} style={{opacity:0.3}}/>
          <p className="text-sm font-semibold">Error al renderizar el análisis</p>
          <p className="text-xs text-gray-500 max-w-md text-center">{String(this.state.error)}</p>
          <button type="button" className="text-xs text-blue-400 hover:underline mt-1"
            onClick={() => this.setState({ error: null })}>
            Reintentar
          </button>
        </div>
      );
    }
    return this.props.children;
  }
}

const ProductosTab = ({ data }) => {
  const [search,       setSearch]       = useState("");
  const [dateFrom,     setDateFrom]     = useState("");
  const [dateTo,       setDateTo]       = useState("");
  const [panelProduct, setPanelProduct] = useState(null);
  const prodSort = useSort("venta", "desc");

  const rows = useMemo(() =>
    data.map((r) => ({
      producto:  col(r, "Producto"),
      cliente:   col(r, "Razón Social", "Razon Social", "Cliente", "Rz. Social"),
      fecha:     parseDate(col(r, "Fecha")),
      venta:     parseNum(col(r, "Total Línea", "Total Linea", "Total")),
      contrib:   parseNum(col(r, "Margen Contrib $")),
      cantidad:  parseNum(col(r, "Cantidad")),
      precioUn:  parseNum(col(r, "Precio Un.", "Precio Un", "Precio Unitario", "P.U.")),
    })).filter((r) => r.fecha && r.producto),
  [data]);

  const dateBounds = useMemo(() => {
    if (!rows.length) return { min: "", max: "" };
    const toInput = (ms) => {
      const d = new Date(ms);
      return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
    };
    let minT = Infinity, maxT = -Infinity;
    rows.forEach((r) => { const t = r.fecha.getTime(); if (t < minT) minT = t; if (t > maxT) maxT = t; });
    return { min: toInput(minT), max: toInput(maxT) };
  }, [rows]);

  useEffect(() => {
    if (dateBounds.min && !dateFrom) setDateFrom(dateBounds.min);
    if (dateBounds.max && !dateTo)   setDateTo(dateBounds.max);
  }, [dateBounds.min, dateBounds.max]);

  const filteredRows = useMemo(() => {
    const from = dateFrom ? new Date(dateFrom) : null;
    const to   = dateTo   ? new Date(dateTo + "T23:59:59") : null;
    return rows.filter((r) => {
      if (from && r.fecha < from) return false;
      if (to   && r.fecha > to)   return false;
      return true;
    });
  }, [rows, dateFrom, dateTo]);

  const productSummary = useMemo(() => {
    const map = {};
    filteredRows.forEach((r) => {
      const k = r.producto;
      if (!map[k]) map[k] = { producto: k, venta: 0, contrib: 0, cantidad: 0, clientes: new Set(), rows: [] };
      map[k].venta    += r.venta;
      map[k].contrib  += r.contrib;
      map[k].cantidad += r.cantidad;
      if (r.cliente) map[k].clientes.add(r.cliente);
      map[k].rows.push(r);
    });
    return Object.values(map).map((p) => {
      const margen = p.venta > 0 ? (p.contrib / p.venta) * 100 : 0;
      // Delta 30d: last 30d vs previous 30d within filtered range
      const prodRows = filteredRows.filter(r => r.producto === p.producto);
      const curr30End = dateTo ? new Date(dateTo + "T23:59:59") : new Date();
      const curr30Start = new Date(curr30End.getTime() - 29 * 86400000);
      const prev30End2 = new Date(curr30End.getTime() - 30 * 86400000);
      const prev30Start2 = new Date(curr30End.getTime() - 59 * 86400000);
      const curr30V = prodRows.filter(r => r.fecha >= curr30Start && r.fecha <= curr30End).reduce((s,r) => s + r.venta, 0);
      const prev30V = prodRows.filter(r => r.fecha >= prev30Start2 && r.fecha <= prev30End2).reduce((s,r) => s + r.venta, 0);
      const delta30 = prev30V > 0 ? ((curr30V - prev30V) / prev30V) * 100 : null;
      return {
        ...p, clientes: p.clientes.size, margen, delta30,
      };
    });
  }, [filteredRows, dateTo]);

  const globalStats = useMemo(() => ({
    totalProductos: productSummary.length,
    totalVenta:     productSummary.reduce((s, p) => s + p.venta,   0),
    totalContrib:   productSummary.reduce((s, p) => s + p.contrib, 0),
    totalClientes:  new Set(filteredRows.map((r) => r.cliente).filter(Boolean)).size,
  }), [productSummary, filteredRows]);

  const filteredProducts = useMemo(() => {
    if (!search.trim()) return productSummary;
    const q = normStr(search);
    return productSummary.filter((p) => normStr(p.producto).includes(q));
  }, [productSummary, search]);

  const sortedProducts = useMemo(() =>
    applySort(filteredProducts, prodSort.key, prodSort.dir, (p, k) => {
      if (k === "producto") return p.producto.toLowerCase();
      if (k === "delta30") return p.delta30 ?? -999;
      return p[k] ?? 0;
    }),
  [filteredProducts, prodSort.key, prodSort.dir]);

  const { page, go, totalPages, slice, total } = usePag(sortedProducts);

  const panelDetail = useMemo(() => {
    if (!panelProduct) return null;
    const pRows = panelProduct.rows;
    const byWeek = {};
    pRows.forEach((r) => {
      const ws = getWeekStart(r.fecha);
      const wk = ws.toISOString().slice(0, 10);
      if (!byWeek[wk]) byWeek[wk] = { label: fmtDate(ws), venta: 0, contrib: 0 };
      byWeek[wk].venta   += r.venta;
      byWeek[wk].contrib += r.contrib;
    });
    const trend = Object.entries(byWeek).sort(([a],[b]) => a.localeCompare(b)).map(([,v]) => v);
    const clientMap = {};
    pRows.forEach((r) => {
      const k = r.cliente || "Sin razón social";
      if (!clientMap[k]) clientMap[k] = { cliente: k, venta: 0, contrib: 0, cantidad: 0, precios: [], lastFecha: null };
      clientMap[k].venta    += r.venta;
      clientMap[k].contrib  += r.contrib;
      clientMap[k].cantidad += r.cantidad;
      if (r.precioUn > 0) clientMap[k].precios.push({ p: r.precioUn, q: r.cantidad || 1, fecha: r.fecha });
      if (!clientMap[k].lastFecha || (r.fecha && r.fecha > clientMap[k].lastFecha)) clientMap[k].lastFecha = r.fecha;
    });
    const totalProdVenta = Object.values(clientMap).reduce((s, c) => s + c.venta, 0);
    const clientBreakdown = Object.values(clientMap).map((c) => {
      const ps = c.precios;
      const precioMin = ps.length ? ps.reduce((m, x) => Math.min(m, x.p), Infinity) : 0;
      const precioMax = ps.length ? ps.reduce((m, x) => Math.max(m, x.p), -Infinity) : 0;
      const totalQ = ps.reduce((s, x) => s + x.q, 0);
      const precioPromedio = totalQ > 0 ? ps.reduce((s, x) => s + x.p * x.q, 0) / totalQ : 0;
      const lastEntry = ps.length ? [...ps].sort((a,b) => b.fecha - a.fecha)[0] : null;
      return {
        ...c, margen: c.venta > 0 ? (c.contrib / c.venta) * 100 : 0,
        pct: totalProdVenta > 0 ? (c.venta / totalProdVenta) * 100 : 0,
        precioMin, precioMax, precioPromedio,
        precioUltimo: lastEntry ? lastEntry.p : 0,
      };
    }).sort((a, b) => b.venta - a.venta);
    return { ...panelProduct, trend, clientBreakdown };
  }, [panelProduct]);

  const STH = (props) => <SortTh {...props} currentKey={prodSort.key} dir={prodSort.dir} onSort={prodSort.toggle}/>;

  return (
    <div className="space-y-4">
      {/* Product detail panel */}
      {panelDetail && (
        <DetailPanel
          title={panelDetail.producto}

              <Card label="Contribución"   value={"$" + fmtM(panelDetail.contrib)} color="text-emerald-300"/>
              <Card label="Margen %"       value={fmtPct(panelDetail.margen)}
                color={panelDetail.margen > 15 ? "text-emerald-300" : panelDetail.margen > 0 ? "text-yellow-300" : "text-red-400"}/>
              <Card label="Cantidad Total" value={fmt(panelDetail.cantidad, 2)} color="text-white" sub="kg / unid."/>

              <div style={{background:"#111827",border:"1px solid #374151",borderRadius:12,padding:12}}>
                <p style={{fontSize:11,color:"#6B7280",marginBottom:8,textTransform:"uppercase",letterSpacing:"0.05em"}}>Tendencia semanal</p>
                <SvgTrend data={panelDetail.trend} height={90}/>
                <div style={{display:"flex",gap:16,marginTop:4,fontSize:11,color:"#6B7280"}}>
                  <span><span style={{display:"inline-block",width:12,height:2,background:"#3B82F6",verticalAlign:"middle",marginRight:4}}/>Venta</span>
                  <span><span style={{display:"inline-block",width:12,height:2,background:"#10B981",verticalAlign:"middle",marginRight:4}}/>Contribución</span>
                </div>
              </div>
            )}
            <div style={{background:"#111827",border:"1px solid #374151",borderRadius:12,overflow:"hidden"}}>
              <div style={{padding:"10px 16px",borderBottom:"1px solid #374151",fontSize:11,fontWeight:600,
                color:"#6B7280",textTransform:"uppercase",letterSpacing:"0.05em"}}>
                Clientes — {panelDetail.clientBreakdown.length}
              </div>
              <div style={{overflowX:"auto",overflowY:"visible"}}>
                <table style={{width:"100%",borderCollapse:"collapse"}}>
                  <thead style={{background:"#1f2937",position:"sticky",top:0}}>
                    <tr>
                      <Th ch="Cliente"/>
                      <Th ch="% del Prod." right/><Th ch="Venta" right/><Th ch="Margen %" right/>
                      <Th ch="P. Promedio" right/><Th ch="Último Precio" right/><Th ch="Cantidad" right/>
                    </tr>
                  </thead>
                  <tbody>
                    {panelDetail.clientBreakdown.map((c, i) => (
                      <tr key={i} style={{borderBottom:"1px solid rgba(31,41,55,0.6)"}}>
                        <td style={{padding:"8px 12px",fontSize:13,color:"#E5E7EB",maxWidth:200}}>
                          <span style={{display:"block",overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{c.cliente}</span>
                        </td>
                        <Td ch={fmtPct(c.pct)} right bold color={c.pct > 30 ? "text-red-400" : c.pct > 15 ? "text-yellow-300" : "text-blue-300"}/>
                        <Td ch={"$" + fmtM(c.venta)} right bold/>
                        <Td ch={fmtPct(c.margen)} right color={c.margen > 15 ? "text-emerald-300" : c.margen > 0 ? "text-yellow-300" : "text-red-400"}/>
                        <Td ch={c.precioPromedio > 0 ? "$" + fmtM(c.precioPromedio) : "-"} right color="text-blue-300"/>
                        <Td ch={c.precioUltimo  > 0 ? "$" + fmtM(c.precioUltimo)  : "-"} right color="text-yellow-300" bold/>
                        <Td ch={fmt(c.cantidad, 2)} right dim/>
                      </tr>
                    ))}
                  </tbody>
                </table>
              </div>
            </div>
          </div>
        </DetailPanel>
      )}

      {/* Header KPIs */}
      <div className="grid grid-cols-2 lg:grid-cols-4 gap-3">
        <Card label="Productos Distintos" value={globalStats.totalProductos}             color="text-blue-300"/>
        <Card label="Venta Total Período"  value={"$" + fmtM(globalStats.totalVenta)}   color="text-white"/>
        <Card label="Contribución Total"   value={"$" + fmtM(globalStats.totalContrib)} color="text-emerald-300"
          sub={"Margen: " + fmtPct(globalStats.totalVenta > 0 ? (globalStats.totalContrib / globalStats.totalVenta) * 100 : 0)}/>
        <Card label="Clientes Únicos"      value={globalStats.totalClientes}             color="text-pink-300"/>
      </div>

      {/* Filters row */}
      <div className="flex gap-3 items-end flex-wrap">
        <div className="flex gap-2 items-end shrink-0">
          <div>
            <p className="text-xs mb-1" style={{color:"#444458"}}>Desde</p>
            <input type="date" value={dateFrom} min={dateBounds.min} max={dateBounds.max}
              onChange={(e) => setDateFrom(e.target.value)}
              className="px-2.5 py-2 rounded-lg text-sm text-white"
              style={{background:"#0F0F16",border:"1px solid #21212E",outline:"none",color:"#E5E7EB"}}
              onFocus={e=>{e.target.style.borderColor="#3B4DE8";}}
              onBlur={e=>{e.target.style.borderColor="#21212E";}}/>
          </div>
          <div>
            <p className="text-xs mb-1" style={{color:"#444458"}}>Hasta</p>
            <input type="date" value={dateTo} min={dateBounds.min} max={dateBounds.max}
              onChange={(e) => setDateTo(e.target.value)}
              className="px-2.5 py-2 rounded-lg text-sm text-white"
              style={{background:"#0F0F16",border:"1px solid #21212E",outline:"none",color:"#E5E7EB"}}
              onFocus={e=>{e.target.style.borderColor="#3B4DE8";}}
              onBlur={e=>{e.target.style.borderColor="#21212E";}}/>
          </div>
          <button type="button" onClick={() => { setDateFrom(dateBounds.min); setDateTo(dateBounds.max); }}
            className="text-xs text-gray-600 hover:text-blue-400 transition-colors pb-2.5">Restablecer</button>
        </div>
        <div className="flex-1 min-w-[200px]">
          <SearchBar value={search} onChange={(v) => { setSearch(v); go(0); }} placeholder="Buscar producto…"/>
        </div>
      </div>

      {/* Products table */}
      <div className="bg-gray-900 border border-gray-700 rounded-xl overflow-hidden">
        <div className="px-4 py-2.5 border-b border-gray-700 text-xs text-gray-500">
          {filteredProducts.length !== productSummary.length
            ? `${filteredProducts.length} de ${productSummary.length} productos`
            : `${productSummary.length} productos — haz clic para ver detalle`}
        </div>
        <div className="overflow-x-auto">
          <table className="w-full">
            <thead className="bg-gray-800/60">
              <tr>
                <STH label="Producto"     sk="producto" />
                <STH label="Venta Neta"   sk="venta"    right/>
                <STH label="Contribución" sk="contrib"  right/>
                <STH label="Margen %"     sk="margen"   right/>
                <STH label="Cantidad"     sk="cantidad" right/>
                <STH label="Clientes"     sk="clientes" right/>
                <STH label="Tendencia"    sk="delta30"  right/>
              </tr>
            </thead>
            <tbody className="divide-y divide-gray-800/60">
              {slice.map((p) => (
                <tr key={p.producto} onClick={() => setPanelProduct(p)} style={{cursor:"pointer"}}
                  className="hover:bg-blue-900/20 transition-colors">
                  <td className="px-3 py-2.5 text-sm font-medium text-white max-w-[260px]">
                    <span className="block truncate" title={p.producto}>{p.producto}</span>
                  </td>
                  <Td ch={"$" + fmtM(p.venta)}   right bold/>
                  <Td ch={"$" + fmtM(p.contrib)}  right color="text-emerald-400"/>
                  <Td ch={fmtPct(p.margen)} right color={p.margen > 15 ? "text-emerald-300" : p.margen > 0 ? "text-yellow-300" : "text-red-400"}/>
                  <Td ch={fmt(p.cantidad, 2)} right dim/>
                  <Td ch={p.clientes} right dim/>
                  <td className="px-3 py-2.5 text-sm text-right whitespace-nowrap">
                    {p.delta30 != null && isFinite(p.delta30)
                      ? <span style={{
                          fontSize: 11, padding: "2px 7px", borderRadius: 99, fontWeight: 700,
                          background: p.delta30 >= 0 ? "rgba(16,185,129,0.12)" : "rgba(239,68,68,0.12)",
                          color: p.delta30 >= 0 ? "#34D399" : "#F87171",
                          border: `1px solid ${p.delta30 >= 0 ? "rgba(16,185,129,0.3)" : "rgba(239,68,68,0.3)"}`
                        }}>
                          {p.delta30 >= 0 ? "↑" : "↓"}{Math.abs(p.delta30).toFixed(0)}%
                        </span>
                      : <span style={{color:"#333345",fontSize:11}}>—</span>}
                  </td>
                </tr>
              ))}
            </tbody>
          </table>
        </div>
        <Pager page={page} totalPages={totalPages} go={go} total={total}/>
      </div>
    </div>
  );
};
